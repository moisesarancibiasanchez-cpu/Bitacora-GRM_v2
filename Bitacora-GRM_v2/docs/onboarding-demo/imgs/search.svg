  <!-- Result 2 -->
  <rect x="130" y="170" width="460" height="44" rx="6" fill="#fff"/>
  <text x="146" y="190" font-family="system-ui" font-size="12" fill="#1e293b">INC-0019 — SAP no carga reportes</text>
  <text x="146" y="206" font-family="system-ui" font-size="10" fill="#64748b">Ticket · Resuelto · Media</text>

  <!-- Command -->
  <rect x="130" y="220" width="460" height="44" rx="6" fill="#fff"/>
  <text x="146" y="240" font-family="system-ui" font-size="12" fill="#1e293b">⚡ Crear nuevo ticket</text>
  <text x="146" y="256" font-family="system-ui" font-size="10" fill="#64748b">Comando rápido</text>

  <!-- Footer -->
