{% extends "base.html" %}
{% block title %}Iniciar sesión · {{ app_name }}{% endblock %}
{% block content %}
<div class="w-full max-w-sm">
    <div class="bg-white shadow-md rounded-lg px-8 py-6 border border-slate-200">
        <div class="text-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 mx-auto text-blue-600" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
            </svg>
            <h1 class="text-xl font-semibold text-slate-900 mt-2">{{ app_name }}</h1>
            <p class="text-sm text-slate-500">Inicia sesión para continuar</p>
        </div>

        {% if error %}
        <div class="mb-4 px-3 py-2 text-sm rounded bg-rose-50 text-rose-700 border border-rose-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/auth/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus
                       class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded">
                Entrar
            </button>
        </form>

        <p class="mt-4 text-xs text-center text-slate-400">
            Credenciales iniciales: <code>admin</code> / <code>admin123</code>
        </p>
    </div>
</div>
{% endblock %}
