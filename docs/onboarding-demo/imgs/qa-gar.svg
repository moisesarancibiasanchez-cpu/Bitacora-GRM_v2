<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Campos de pruebas de calidad: módulo, ambiente, ítem, resultado y código GAR">
  <rect width="720" height="400" rx="8" fill="#f1f5f9"/>

  <text x="24" y="28" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Datos de pruebas de calidad en el ticket</text>
  <text x="24" y="44" font-family="system-ui" font-size="10" fill="#64748b">Los tickets de garantía se cargan en bloque con su resultado de pruebas y su código de expediente.</text>

  <!-- Formulario -->
  <rect x="24" y="60" width="352" height="316" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="82" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Campos del formulario</text>

  <text x="40" y="104" font-family="system-ui" font-size="9" font-weight="600" fill="#475569">Modulo</text>
  <rect x="40" y="110" width="152" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="126" font-family="system-ui" font-size="10" fill="#1e293b">Control ERM</text>
  <path d="M178 120 L184 126 L178 132 Z" fill="#64748b"/>
  <text x="204" y="126" font-family="system-ui" font-size="8" fill="#64748b">11 valores</text>

  <text x="40" y="152" font-family="system-ui" font-size="9" font-weight="600" fill="#475569">Ambiente</text>
  <rect x="40" y="158" width="66" height="22" rx="11" fill="#eef2ff"/>
  <text x="73" y="173" font-family="system-ui" font-size="9" text-anchor="middle" fill="#3730a3" font-weight="600">QA</text>
  <rect x="114" y="158" width="92" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="160" y="173" font-family="system-ui" font-size="9" text-anchor="middle" fill="#475569" font-weight="600">PRODUCCION</text>

  <text x="40" y="198" font-family="system-ui" font-size="9" font-weight="600" fill="#475569">Item a probar</text>
  <rect x="40" y="204" width="102" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="91" y="219" font-family="system-ui" font-size="9" text-anchor="middle" fill="#475569" font-weight="600">Portal WEB APEX</text>
  <rect x="150" y="204" width="62" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="181" y="219" font-family="system-ui" font-size="9" text-anchor="middle" fill="#475569" font-weight="600">Email</text>
  <rect x="220" y="204" width="92" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="266" y="219" font-family="system-ui" font-size="9" text-anchor="middle" fill="#475569" font-weight="600">Base de Datos</text>

  <text x="40" y="246" font-family="system-ui" font-size="9" font-weight="600" fill="#475569">Resultado de pruebas</text>
  <rect x="40" y="254" width="44" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="62" y="269" font-family="system-ui" font-size="9" text-anchor="middle" fill="#166534" font-weight="700">OK</text>
  <rect x="90" y="254" width="44" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="112" y="269" font-family="system-ui" font-size="9" text-anchor="middle" fill="#475569" font-weight="600">N/A</text>
  <rect x="140" y="254" width="94" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="187" y="269" font-family="system-ui" font-size="9" text-anchor="middle" fill="#92400e" font-weight="700">OK CON OBS.</text>
  <rect x="240" y="254" width="42" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="261" y="269" font-family="system-ui" font-size="8" text-anchor="middle" fill="#475569" font-weight="600">NOK</text>
  <rect x="40" y="282" width="92" height="22" rx="11" fill="#eef2ff" stroke="#6366f1"/>
  <text x="86" y="297" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">POSTERGADA</text>
  <rect x="140" y="282" width="92" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="186" y="297" font-family="system-ui" font-size="8" text-anchor="middle" fill="#475569" font-weight="600">DESESTIMADA</text>

  <line x1="40" y1="320" x2="360" y2="320" stroke="#e2e8f0"/>
  <text x="40" y="338" font-family="system-ui" font-size="9" font-weight="600" fill="#1e293b">QA Tester</text>
  <text x="40" y="352" font-family="system-ui" font-size="8" fill="#64748b">Se guarda como Nombre &lt;email&gt; para</text>
  <text x="40" y="365" font-family="system-ui" font-size="8" fill="#64748b">que quede trazable quién probó.</text>

  <!-- Codigo GAR -->
  <rect x="392" y="60" width="304" height="170" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="408" y="82" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Código del caso de prueba</text>
  <text x="408" y="98" font-family="system-ui" font-size="9" fill="#64748b">Código del caso más el correlativo de carga</text>

  <rect x="408" y="110" width="272" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="544" y="137" font-family="ui-monospace, monospace" font-size="19" font-weight="700" text-anchor="middle" fill="#166534">GAR_HU128-003</text>

  <rect x="408" y="164" width="84" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="184" font-family="system-ui" font-size="8" text-anchor="middle" fill="#64748b">GAR_HU128</text>
  <text x="450" y="202" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle" fill="#1e293b">codigo del caso</text>

  <rect x="502" y="164" width="84" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="544" y="188" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">003</text>
  <text x="544" y="204" font-family="system-ui" font-size="8" text-anchor="middle" fill="#64748b">correlativo</text>

  <rect x="596" y="164" width="84" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="638" y="184" font-family="system-ui" font-size="8" text-anchor="middle" fill="#64748b">20</text>
  <text x="638" y="202" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle" fill="#1e293b">caracteres</text>

  <!-- Explicacion -->
  <rect x="392" y="242" width="304" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="408" y="264" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Cómo se construye</text>

  <text x="408" y="286" font-family="system-ui" font-size="9" fill="#1e293b">El código del caso se toma del archivo de carga.</text>
  <text x="408" y="300" font-family="system-ui" font-size="9" fill="#1e293b">El correlativo avanza con cada fila importada.</text>

  <rect x="408" y="312" width="272" height="26" rx="5" fill="#fef3c7"/>
  <text x="418" y="329" font-family="system-ui" font-size="8" fill="#7c2d12">Si el caso no trae código, se genera</text>
  <text x="620" y="329" font-family="system-ui" font-size="8" font-weight="700" fill="#92400e">GAR_SIN-00042</text>

  <rect x="408" y="344" width="272" height="22" rx="5" fill="#fee2e2"/>
  <text x="418" y="359" font-family="system-ui" font-size="8" fill="#991b1b">Si el código supera los 20 caracteres, se trunca.</text>
</svg>