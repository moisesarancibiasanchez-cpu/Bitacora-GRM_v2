<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Hero Bitácora GRM">
  <defs>
    <linearGradient id="hg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="14" fill="url(#hg)"/>
  <rect width="1200" height="360" rx="14" fill="url(#dots)"/>

  <!-- Big shield + check -->
  <g transform="translate(80,80)">
    <path d="M100 0 L200 36 V124 C200 184 152 222 100 240 C48 222 0 184 0 124 V36 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Kanban columns inside -->
    <g transform="translate(40,80)">
      <rect x="0" y="0" width="28" height="100" rx="4" fill="#4f46e5"/>
      <rect x="38" y="0" width="28" height="100" rx="4" fill="#6366f1"/>
      <rect x="76" y="0" width="28" height="100" rx="4" fill="#a5b4fc"/>
      <line x1="0" y1="34" x2="104" y2="34" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="68" x2="104" y2="68" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    </g>
    <!-- Check -->
    <path d="M120 168 L144 192 L184 152" stroke="#fbbf24" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="380" y="120" font-family="system-ui" font-size="42" font-weight="800" fill="#ffffff">Bitácora GRM v2</text>
  <text x="380" y="160" font-family="system-ui" font-size="20" fill="#e0e7ff">Sistema híbrido de gestión de incidencias</text>
  <text x="380" y="190" font-family="system-ui" font-size="16" fill="#c7d2fe">ITSM estricto + Kanban ágil, en un único tablero</text>

  <g transform="translate(380,220)">
    <rect width="170" height="40" rx="8" fill="#fbbf24"/>
    <text x="85" y="26" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">Ver la guía ↓</text>

    <rect x="190" width="170" height="40" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="275" y="26" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Repo en GitHub</text>
  </g>

  <!-- Stats badges -->
  <g transform="translate(800,80)">
    <rect width="340" height="240" rx="10" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="20" y="40" font-family="system-ui" font-size="12" fill="#cbd5e1">Stack</text>
    <g font-family="system-ui" font-size="13" fill="#fff">
      <text x="20" y="70">🐍 FastAPI</text>
      <text x="20" y="100">🐘 PostgreSQL</text>
      <text x="20" y="130">⚙ Redis + Celery</text>
      <text x="20" y="160">🎨 Jinja2 + HTMX</text>
      <text x="20" y="190">🧲 SortableJS</text>
      <text x="20" y="220">🚂 Railway-ready</text>
    </g>
  </g>
</svg>
