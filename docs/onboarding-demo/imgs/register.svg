  <text x="360" y="150" font-family="system-ui" font-size="11" text-anchor="middle" fill="#64748b">Rol inicial: Solicitante</text>
  <!-- Field rows -->
  <g font-family="system-ui" font-size="11" fill="#475569">
    <text x="170" y="184">Usuario</text>
