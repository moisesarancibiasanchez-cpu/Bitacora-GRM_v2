# =============================================================================
#  pyproject.toml - Bitácora GRM
# =============================================================================
#  Manifiesto del proyecto. La lista de dependencias de runtime es la MISMA
#  que ``requirements.txt`` (fuente de verdad del despliegue: Railway usa
#  ``pip install -r requirements.txt``), y las de desarrollo viven en
#  ``requirements-dev.txt``. Si se cambian, hay que cambiarlas en los tres
#  sitios: aquí, ``requirements.txt`` y ``requirements-dev.txt``.
#
#  Antes este archivo era un esqueleto genérico (``name = "workspace"``,
#  ``packages = ["code"]`` y dependencias de data-science) que NO describía
#  esta aplicación: ``code/`` no existe y ``pip install -e .`` instalaba un
#  paquete vacío, por lo que ``import app`` fallaba en cualquier proceso que
#  no tuviera el repo en el PYTHONPATH.
# =============================================================================

[project]
name = "bitacora-grm"
version = "0.1.0"
description = "Bitácora GRM - Sistema de gestión de tickets ITSM"
readme = "README.md"
# El despliegue corre en Python 3.12 (ver ``mise.toml`` y ``railway.toml``).
# Rango acotado a la rama 3.12: no se declara soporte de versiones que no se
# prueban, y no se fija un patch exacto (un pin ``==3.12.5`` hacía fallar
# cualquier instalación en un patch distinto).
requires-python = ">=3.12,<3.13"

dependencies = [
    # FastAPI / Backend
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "gunicorn==23.0.0",
    "python-multipart==0.0.12",
    "jinja2==3.1.4",
    # Archivos estáticos en producción
    "whitenoise==6.7.0",
    # Base de datos
    "SQLAlchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.13.3",
    # Async / Background tasks
    "celery==5.4.0",
    "redis==5.2.0",
    # Seguridad
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.3.0",
    # Configuración
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    # Utilidades
    "httpx==0.27.2",
    "requests==2.32.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# El paquete real de la aplicación es ``app`` (no ``code/``).
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "tests",
    "requirements.txt",
    "requirements-dev.txt",
    "start.sh",
    "gunicorn.conf.py",
    "railway.toml",
]

# =============================================================================
#  pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite ``import app`` en los tests sin instalar el paquete.
pythonpath = ["."]

# =============================================================================
#  uv (índice alternativo por defecto)
# =============================================================================
#  Nota: el build de Railway NO usa uv (usa ``pip install -r requirements.txt``
#  contra PyPI). Este índice sólo aplica a entornos que usen uv.
#  Se sube a HTTPS: en HTTP plano, los paquetes descargados no se autentican
#  y quedan expuestos a manipulación en tránsito.
[[tool.uv.index]]
url = "https://mirrors.cloud.aliyuncs.com/pypi/simple"
default = true
