{# Fragmento de tarjeta Kanban. Se inyecta en el tablero Y se devuelve por HTMX
   cuando un ticket se mueve. #}
<article class="kanban-ticket bg-white border border-slate-200 rounded-md p-2.5 shadow-sm hover:shadow-md transition-shadow cursor-grab"
         data-ticket-id="{{ t.id }}"
         id="ticket-{{ t.id }}">
    <header class="flex items-start justify-between gap-2 mb-1.5">
        <span class="text-[10px] font-mono text-slate-400">{{ t.codigo }}</span>
        <span class="priority-badge rounded-full font-semibold
                     {% if t.prioridad == 'CRITICA' %}bg-rose-100 text-rose-700
                     {% elif t.prioridad == 'ALTA' %}bg-orange-100 text-orange-700
                     {% elif t.prioridad == 'MEDIA' %}bg-blue-100 text-blue-700
                     {% else %}bg-slate-100 text-slate-600{% endif %}">
            {{ t.prioridad }}
        </span>
    </header>
    <h3 class="text-sm font-medium text-slate-800 leading-snug mb-2 line-clamp-2">{{ t.titulo }}</h3>
    <footer class="flex items-center justify-between text-[11px] text-slate-500">
        <div class="flex items-center gap-1.5" title="Estado del SLA">
            {% if t.sla_cumplido is none %}
                <span class="sla-dot sla-unknown"></span><span>Sin calcular</span>
            {% elif t.sla_cumplido %}
                <span class="sla-dot sla-ok"></span><span>En plazo</span>
            {% else %}
                <span class="sla-dot sla-overdue"></span><span>Vencido</span>
            {% endif %}
        </div>
        <button hx-get="/tickets/{{ t.id }}/auditoria"
                hx-target="#audit-{{ t.id }}"
                hx-swap="innerHTML"
                class="text-blue-600 hover:text-blue-800"
                title="Ver auditoría">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </button>
    </footer>
    <div id="audit-{{ t.id }}" class="mt-2"></div>
</article>
