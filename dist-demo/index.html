<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora GRM · Demo Interactivo (Fixes aplicados)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { overflow-x: hidden; background: #f1f5f9; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .toast { animation: slideInRight 0.25s ease-out; }
    @keyframes slideInRight {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .drop-zone.drag-over { border-color: #6366f1 !important; background: #eef2ff !important; }
    .kanban-card { cursor: pointer; transition: all 0.15s ease; }
    .kanban-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -4px rgba(0,0,0,0.12); }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
    .label-chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; color: white; }
    .spinner { border: 2px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; width: 14px; height: 14px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-slate-800">

<!-- ============== TOP BAR ============== -->
<header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between sticky top-0 z-30">
  <div class="flex items-center gap-3">
    <div class="w-7 h-7 rounded-md bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs">G</div>
    <div>
      <h1 class="text-sm font-semibold text-slate-800">Bitácora GRM</h1>
      <p class="text-[10px] text-slate-500 -mt-0.5">Demo interactivo · Fixes aplicados</p>
    </div>
  </div>
  <div class="flex items-center gap-2 text-[11px]">
    <span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Backend OK
    </span>
    <span class="text-slate-500">Demo · <span class="font-mono text-indigo-600">GRM-DEMO-2026</span></span>
  </div>
</header>

<!-- ============== KANBAN BOARD ============== -->
<main class="px-4 py-3" id="main-content">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-base font-semibold text-slate-800">Tablero Principal</h2>
    <div class="text-[11px] text-slate-500">Click en una tarjeta para abrir el detalle</div>
  </div>
  <div id="kanban-board" class="flex gap-3 overflow-x-auto pb-4">
    <!-- Columns will be rendered by JS -->
  </div>
</main>

<!-- ============== MODAL ROOT ============== -->
<div id="modal-root"></div>

<!-- ============== TOAST CONTAINER ============== -->
<div id="toast-container" class="fixed top-4 right-4 z-[200] flex flex-col gap-2 max-w-sm"></div>

<!-- ============================================================ -->
<!-- =================== MOCK DATA & STATE ====================== -->
<!-- ============================================================ -->
<script>
  // =================================================================
  // ESTADO EN MEMORIA (simula la BD)
  // =================================================================
  const state = {
    tickets: [
      {
        id: 1, codigo: 'GRM-INC-2026-000001',
        titulo: 'Error al cargar el dashboard principal',
        descripcion: 'Al ingresar al dashboard se queda cargando indefinidamente. **Reproducible** en Chrome 120+.',
        prioridad: 'alta', estado_id: 2, asignado_id: 2, creador_id: 1,
        etiquetas: [1, 3], fecha_vencimiento: '2026-09-15',
        comentarios: [
          { id: 1, autor: 'María González', texto: 'Reproducido en mi equipo, sugiero revisar la consulta de métricas.', created_at: '2026-09-09 10:32', avatar: 'MG' },
          { id: 2, autor: 'Carlos Pérez', texto: 'Asignado. Empiezo el análisis.', created_at: '2026-09-09 11:15', avatar: 'CP' }
        ],
        adjuntos: [
          { id: 1, nombre: 'error-log.txt', tamano: 2048, mime: 'text/plain', subido_por: 'María González', created_at: '2026-09-09 10:35' }
        ],
        checklists: [
          { id: 1, titulo: 'Diagnóstico', items: [
            { id: 1, texto: 'Revisar logs del servidor', completado: true },
            { id: 2, texto: 'Reproducir el error en ambiente dev', completado: false },
            { id: 3, texto: 'Verificar query SQL del dashboard', completado: false }
          ]}
        ],
        created_at: '2026-09-09 10:30'
      },
      {
        id: 2, codigo: 'GRM-INC-2026-000002',
        titulo: 'Solicitud de nuevo catálogo: Equipos de Red',
        descripcion: 'Se requiere crear un nuevo catálogo para gestión de equipos de red (switches, routers, access points).',
        prioridad: 'media', estado_id: 1, asignado_id: 3, creador_id: 1,
        etiquetas: [2], fecha_vencimiento: '2026-09-20',
        comentarios: [], adjuntos: [], checklists: [],
        created_at: '2026-09-10 08:00'
      },
      {
        id: 3, codigo: 'GRM-INC-2026-000003',
        titulo: 'Mejorar rendimiento del listado de tickets',
        descripcion: 'La vista de tabla tarda más de 5 segundos en cargar cuando hay más de 1000 tickets.',
        prioridad: 'critica', estado_id: 3, asignado_id: 2, creador_id: 1,
        etiquetas: [1], fecha_vencimiento: '2026-09-12',
        comentarios: [
          { id: 3, autor: 'Carlos Pérez', texto: 'Identifiqué N+1 queries en el endpoint /tickets.', created_at: '2026-09-08 16:42', avatar: 'CP' }
        ],
        adjuntos: [],
        checklists: [
          { id: 2, titulo: 'Optimización', items: [
            { id: 4, texto: 'Agregar eager loading', completado: true },
            { id: 5, texto: 'Implementar paginación cursor-based', completado: false }
          ]}
        ],
        created_at: '2026-09-08 14:20'
      }
    ],
    estados: [
      { id: 1, nombre: 'Backlog',     color: '#94a3b8', orden: 1 },
      { id: 2, nombre: 'En análisis', color: '#3b82f6', orden: 2 },
      { id: 3, nombre: 'En curso',    color: '#f59e0b', orden: 3 },
      { id: 4, nombre: 'En revisión', color: '#8b5cf6', orden: 4 },
      { id: 5, nombre: 'Resuelto',    color: '#10b981', orden: 5 }
    ],
    etiquetas: [
      { id: 1, nombre: 'Bug',     color: '#ef4444' },
      { id: 2, nombre: 'Mejora',  color: '#3b82f6' },
      { id: 3, nombre: 'Urgente', color: '#f97316' },
      { id: 4, nombre: 'Backend', color: '#8b5cf6' }
    ],
    usuarios: [
      { id: 1, nombre: 'Admin Demo',    rol: 'admin' },
      { id: 2, nombre: 'Carlos Pérez',  rol: 'tecnico' },
      { id: 3, nombre: 'Ana Rodríguez', rol: 'tecnico' }
    ],
    audit: []
  };

  // =================================================================
  // UTILIDADES
  // =================================================================
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const escape = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const findTicket = (id) => state.tickets.find(t => t.id === id);
  const findEstado = (id) => state.estados.find(e => e.id === id);
  const findUsuario = (id) => state.usuarios.find(u => u.id === id);
  const findEtiqueta = (id) => state.etiquetas.find(e => e.id === id);
  const nextId = (arr) => arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1;
  const fmtBytes = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';

  // =================================================================
  // TOASTS  (compartido por todos los flujos)
  // =================================================================
  function showToast(message, type = 'info', duration = 3500) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const colors = {
      success: 'bg-emerald-50 border-emerald-400 text-emerald-800',
      error:   'bg-red-50 border-red-400 text-red-800',
      warning: 'bg-amber-50 border-amber-400 text-amber-800',
      info:    'bg-blue-50 border-blue-400 text-blue-800'
    };
    const icons = { success: '✓', error: '✕', warning: '!', info: 'i' };
    const div = document.createElement('div');
    div.className = `toast border-l-4 ${colors[type] || colors.info} bg-white shadow-lg rounded-r-md px-4 py-3 text-sm flex items-start gap-2 min-w-[280px]`;
    div.innerHTML = `
      <span class="font-bold w-4 inline-block text-center">${icons[type] || 'i'}</span>
      <span class="flex-1">${escape(message)}</span>
      <button class="text-slate-400 hover:text-slate-600" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(div);
    setTimeout(() => div.remove(), duration);
  }
  window.showToast = showToast;

  // =================================================================
  // KANBAN BOARD  (render de tarjetas)
  // =================================================================
  function renderKanban() {
    const board = $('#kanban-board');
    board.innerHTML = state.estados.map(estado => {
      const tickets = state.tickets.filter(t => t.estado_id === estado.id);
      return `
        <div class="kanban-column flex-shrink-0 w-72 bg-slate-100 rounded-lg p-2" data-estado-id="${estado.id}">
          <div class="flex items-center justify-between px-2 py-1.5 mb-2">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full" style="background-color: ${estado.color}"></span>
              <h3 class="text-xs font-semibold text-slate-700">${escape(estado.nombre)}</h3>
              <span class="text-[10px] text-slate-500">${tickets.length}</span>
            </div>
          </div>
          <div class="space-y-2 min-h-[200px]" data-column-body="${estado.id}">
            ${tickets.map(renderCard).join('')}
          </div>
        </div>
      `;
    }).join('');

    // Activar SortableJS para drag & drop
    $$('[data-column-body]').forEach(col => {
      new Sortable(col, {
        group: 'tickets',
        animation: 150,
        ghostClass: 'opacity-30',
        onEnd: async (evt) => {
          const ticketId = parseInt(evt.item.dataset.ticketId);
          const newEstadoId = parseInt(evt.to.dataset.columnBody);
          // Simular validación ITSM
          const result = await mockValidarTransicion(ticketId, newEstadoId);
          if (!result.ok) {
            // Revertir el movimiento
            evt.from.insertBefore(evt.item, evt.from.children[evt.oldIndex] || null);
            showToast(result.error, 'error', 4500);
            return;
          }
          // Aplicar cambio
          const ticket = findTicket(ticketId);
          ticket.estado_id = newEstadoId;
          state.audit.push({ ticket_id: ticketId, accion: 'estado_cambiado', detalle: `→ ${findEstado(newEstadoId).nombre}`, fecha: new Date().toISOString() });
          showToast(`Ticket movido a ${findEstado(newEstadoId).nombre}`, 'success');
        }
      });
    });

    // Listener para click en tarjeta
    $$('.kanban-card').forEach(card => {
      card.addEventListener('click', () => openTicketModal(parseInt(card.dataset.ticketId)));
    });
  }

  function renderCard(t) {
    const etiquetas = (t.etiquetas || []).map(id => findEtiqueta(id)).filter(Boolean);
    const totalCheckItems = (t.checklists || []).reduce((acc, cl) => acc + cl.items.length, 0);
    const doneCheckItems = (t.checklists || []).reduce((acc, cl) => acc + cl.items.filter(i => i.completado).length, 0);
    return `
      <div class="kanban-card bg-white rounded-md p-2.5 shadow-sm border border-slate-200"
           data-ticket-id="${t.id}">
        <div class="flex items-center gap-1.5 mb-1.5">
          <span class="font-mono text-[10px] text-slate-400">${escape(t.codigo)}</span>
          <span class="inline-flex items-center gap-1 rounded-full px-1.5 py-0.5 text-[9px] font-semibold
            ${t.prioridad === 'critica' ? 'bg-red-100 text-red-700' :
              t.prioridad === 'alta' ? 'bg-orange-100 text-orange-700' :
              t.prioridad === 'media' ? 'bg-yellow-100 text-yellow-700' :
              'bg-slate-100 text-slate-600'}">
            ${t.prioridad.toUpperCase()}
          </span>
        </div>
        <p class="text-[12px] font-medium text-slate-800 leading-tight mb-2">${escape(t.titulo)}</p>
        ${etiquetas.length ? `<div class="flex flex-wrap gap-1 mb-1.5">${etiquetas.map(e => `<span class="label-chip" style="background-color: ${e.color}">${escape(e.nombre)}</span>`).join('')}</div>` : ''}
        <div class="flex items-center justify-between text-[10px] text-slate-500">
          <div class="flex items-center gap-2">
            ${t.comentarios.length ? `<span class="inline-flex items-center gap-0.5">💬 ${t.comentarios.length}</span>` : ''}
            ${t.adjuntos.length ? `<span class="inline-flex items-center gap-0.5">📎 ${t.adjuntos.length}</span>` : ''}
            ${totalCheckItems ? `<span class="inline-flex items-center gap-0.5">☑ ${doneCheckItems}/${totalCheckItems}</span>` : ''}
          </div>
          <span class="font-mono text-[9px] text-slate-400">${escape(t.codigo.split('-').pop())}</span>
        </div>
      </div>
    `;
  }

  // Simulación de validación de transición (regla ITSM)
  async function mockValidarTransicion(ticketId, newEstadoId) {
    await new Promise(r => setTimeout(r, 200));
    const ticket = findTicket(ticketId);
    if (!ticket) return { ok: false, error: 'Ticket no encontrado' };
    // No se puede mover de Resuelto a En curso (regla de demo)
    if (ticket.estado_id === 5 && newEstadoId !== 5) {
      return { ok: false, error: 'Transición no permitida: un ticket resuelto no puede reabrirse sin una acción explícita' };
    }
    return { ok: true };
  }

  // =================================================================
  // MODAL DE DETALLE
  // =================================================================
  function openTicketModal(ticketId) {
    const ticket = findTicket(ticketId);
    if (!ticket) return;
    const root = $('#modal-root');
    root.innerHTML = renderDetalleModal(ticket, 'detalles');
    bindModalEvents(ticketId);
    // Re-inicializar el dropzone y editores tras insertar HTML
    setTimeout(() => {
      reinitModalExtras();
    }, 0);
  }

  function closeModal() {
    $('#modal-root').innerHTML = '';
    renderKanban(); // refrescar el board
  }
  window.closeModal = closeModal;

  function renderDetalleModal(ticket, activeTab = 'detalles') {
    const estado = findEstado(ticket.estado_id);
    const asignado = findUsuario(ticket.asignado_id);
    const etiquetas = (ticket.etiquetas || []).map(id => findEtiqueta(id)).filter(Boolean);
    const etiquetasDisponibles = state.etiquetas.filter(e => !ticket.etiquetas.includes(e.id));
    const usuarios = state.usuarios;

    const tabBtn = (tab, label, count) => `
      <button class="tab-btn px-3 py-2 text-[11px] font-medium border-b-2 ${activeTab === tab ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700'}"
              data-tab="${tab}">
        ${label}${count !== undefined ? ` <span class="ml-1 px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[9px]">${count}</span>` : ''}
      </button>
    `;

    return `
      <div class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-900/50 modal-backdrop"
           data-modal="detalle-ticket" data-ticket-id="${ticket.id}">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl mx-4 overflow-hidden flex flex-col max-h-[92vh]">

          <!-- HEADER -->
          <div class="px-5 py-4 border-b border-slate-200 flex items-start justify-between gap-3 flex-shrink-0">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="font-mono text-[10px] text-slate-500">${escape(ticket.codigo)}</span>
                <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[10px] font-semibold
                  ${ticket.prioridad === 'critica' ? 'bg-red-100 text-red-700' :
                    ticket.prioridad === 'alta' ? 'bg-orange-100 text-orange-700' :
                    ticket.prioridad === 'media' ? 'bg-yellow-100 text-yellow-700' :
                    'bg-slate-100 text-slate-600'}">
                  ${ticket.prioridad.toUpperCase()}
                </span>
                <span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
                  <span class="inline-block w-2 h-2 rounded-full" style="background-color: ${estado.color}"></span>
                  ${escape(estado.nombre)}
                </span>
              </div>
              <!-- INPUT TÍTULO con auto-save -->
              <div class="flex items-center gap-1">
                <input type="text" name="valor_titulo" value="${escape(ticket.titulo)}"
                       data-original="${escape(ticket.titulo)}"
                       class="flex-1 min-w-0 text-base font-semibold text-slate-800 leading-snug bg-transparent border-0 border-b border-transparent
                              hover:border-slate-200 focus:border-indigo-400 focus:ring-0 px-0 py-0.5 outline-none transition-colors"
                       placeholder="Título del ticket..." />
                <span class="auto-save-indicator hidden w-4 h-4 flex items-center justify-center" data-for="titulo">
                  <span class="spinner"></span>
                </span>
                <span class="auto-save-check hidden text-emerald-500 text-sm" data-for="titulo">✓</span>
                <button data-action="duplicar-ticket" data-ticket-id="${ticket.id}"
                        title="Duplicar este ticket"
                        class="w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors flex-shrink-0">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                </button>
              </div>
            </div>
            <button data-close-modal class="w-8 h-8 rounded-md flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>

          <!-- TABS -->
          <div class="border-b border-slate-200 px-5 flex items-center gap-1 flex-shrink-0" role="tablist">
            ${tabBtn('detalles',     'Detalles')}
            ${tabBtn('comentarios',  'Comentarios', ticket.comentarios.length)}
            ${tabBtn('adjuntos',     'Adjuntos',    ticket.adjuntos.length)}
            ${tabBtn('checklist',    'Checklist',   ticket.checklists.reduce((a, c) => a + c.items.length, 0))}
          </div>

          <!-- BODY -->
          <div class="flex-1 overflow-y-auto p-5">

            <!-- TAB: DETALLES -->
            <div class="tab-panel ${activeTab === 'detalles' ? 'active' : ''}" data-panel="detalles">
              <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                  <label class="block text-[10px] font-medium text-slate-500 uppercase mb-1">Estado</label>
                  <select data-action="cambiar-estado" data-ticket-id="${ticket.id}"
                          class="w-full text-xs px-2 py-1.5 border border-slate-300 rounded-md bg-white">
                    ${state.estados.map(e => `<option value="${e.id}" ${e.id === ticket.estado_id ? 'selected' : ''}>${escape(e.nombre)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] font-medium text-slate-500 uppercase mb-1">Asignado</label>
                  <select data-action="cambiar-asignado" data-ticket-id="${ticket.id}"
                          class="w-full text-xs px-2 py-1.5 border border-slate-300 rounded-md bg-white">
                    <option value="">Sin asignar</option>
                    ${usuarios.map(u => `<option value="${u.id}" ${u.id === ticket.asignado_id ? 'selected' : ''}>${escape(u.nombre)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] font-medium text-slate-500 uppercase mb-1">Prioridad</label>
                  <select data-action="cambiar-prioridad" data-ticket-id="${ticket.id}"
                          class="w-full text-xs px-2 py-1.5 border border-slate-300 rounded-md bg-white">
                    ${['baja','media','alta','critica'].map(p => `<option value="${p}" ${p === ticket.prioridad ? 'selected' : ''}>${p}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] font-medium text-slate-500 uppercase mb-1">Vencimiento</label>
                  <input type="date" data-action="cambiar-vencimiento" data-ticket-id="${ticket.id}"
                         value="${ticket.fecha_vencimiento || ''}"
                         class="w-full text-xs px-2 py-1.5 border border-slate-300 rounded-md" />
                </div>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] font-medium text-slate-500 uppercase mb-1">Descripción</label>
                <textarea data-action="cambiar-descripcion" data-ticket-id="${ticket.id}" rows="4"
                          class="w-full text-xs px-2 py-1.5 border border-slate-300 rounded-md"
                          placeholder="Descripción del ticket...">${escape(ticket.descripcion)}</textarea>
              </div>

              <!-- ETIQUETAS -->
              <div class="mb-4">
                <label class="block text-[10px] font-medium text-slate-500 uppercase mb-2">Etiquetas</label>
                <div class="flex flex-wrap gap-1.5 mb-2" data-etiquetas-asignadas="${ticket.id}">
                  ${etiquetas.map(e => `
                    <span class="label-chip group inline-flex items-center gap-1" style="background-color: ${e.color}" data-etiqueta-id="${e.id}">
                      ${escape(e.nombre)}

  // =================================================================
  // EVENTOS DEL MODAL
  // =================================================================
  function bindModalEvents(ticketId) {
    const modal = document.querySelector(`[data-modal="detalle-ticket"][data-ticket-id="${ticketId}"]`);
    if (!modal) return;
    const ticket = findTicket(ticketId);
    if (!ticket) return;

    // ---- Cerrar modal ----
    modal.addEventListener('click', (e) => {
      if (e.target.matches('[data-close-modal]') || e.target.classList.contains('modal-backdrop')) {
        closeModal();
      }
    });

    // ---- Tabs ----
    $$('.tab-btn', modal).forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        $$('.tab-btn', modal).forEach(b => b.classList.remove('border-indigo-600', 'text-indigo-700'));
        $$('.tab-btn', modal).forEach(b => b.classList.add('border-transparent', 'text-slate-500'));
        btn.classList.add('border-indigo-600', 'text-indigo-700');
        btn.classList.remove('border-transparent', 'text-slate-500');
        $$('.tab-panel', modal).forEach(p => p.classList.remove('active'));
        $(`[data-panel="${tab}"]`, modal).classList.add('active');
      });
    });

    // ---- FIX #1: Auto-save título (sin re-render del modal) ----
    const titleInput = $('input[name="valor_titulo"]', modal);
    let saveTimer = null;
    titleInput.addEventListener('input', () => {
      clearTimeout(saveTimer);
      const indicator = $('.auto-save-indicator[data-for="titulo"]', modal);
      const check = $('.auto-save-check[data-for="titulo"]', modal);
      indicator.classList.remove('hidden');
      check.classList.add('hidden');
      saveTimer = setTimeout(async () => {
        const newValue = titleInput.value.trim();
        if (newValue === titleInput.dataset.original) {
          indicator.classList.add('hidden');
          return;
        }
        // Simular PATCH
        await mockPatch(ticketId, 'titulo', newValue);
        ticket.titulo = newValue;
        titleInput.dataset.original = newValue;
        indicator.classList.add('hidden');
        check.classList.remove('hidden');
        showToast('Título guardado correctamente', 'success');
        setTimeout(() => check.classList.add('hidden'), 1500);
      }, 600);
    });

    // ---- Cambiar select (estado/asignado/prioridad) con auto-save ----
    $('[data-action="cambiar-estado"]', modal).addEventListener('change', async (e) => {
      const newEstadoId = parseInt(e.target.value);
      const result = await mockValidarTransicion(ticketId, newEstadoId);
      if (!result.ok) {
        e.target.value = ticket.estado_id;
        showToast(result.error, 'error', 4500);
        return;
      }
      ticket.estado_id = newEstadoId;
      showToast(`Estado cambiado a ${findEstado(newEstadoId).nombre}`, 'success');
    });
    $('[data-action="cambiar-asignado"]', modal).addEventListener('change', async (e) => {
      ticket.asignado_id = e.target.value ? parseInt(e.target.value) : null;
      const u = findUsuario(ticket.asignado_id);
      showToast(u ? `Asignado a ${u.nombre}` : 'Asignación removida', 'success');
    });
    $('[data-action="cambiar-prioridad"]', modal).addEventListener('change', async (e) => {
      ticket.prioridad = e.target.value;
      showToast(`Prioridad cambiada a ${e.target.value}`, 'success');
    });
    $('[data-action="cambiar-vencimiento"]', modal).addEventListener('change', async (e) => {
      ticket.fecha_vencimiento = e.target.value;
      showToast('Fecha de vencimiento actualizada', 'success');
    });
    $('[data-action="cambiar-descripcion"]', modal).addEventListener('change', async (e) => {
      ticket.descripcion = e.target.value;
      showToast('Descripción guardada', 'success');
    });

    // ---- FIX #2: Agregar comentario ----
    $('[data-form="agregar-comentario"]', modal).addEventListener('submit', (e) => {
      e.preventDefault();
      const texto = $('textarea[name="texto"]', e.target).value.trim();
      if (!texto) return;
      const newComment = {
        id: nextId(ticket.comentarios),
        autor: 'Tú',
        texto,
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        avatar: 'TU'
      };
      ticket.comentarios.push(newComment);
      showToast('Comentario agregado correctamente', 'success');
      // Re-render solo del modal (no perder foco)
      openTicketModal(ticketId);
    });

    // ---- Eliminar comentario ----
    $$('[data-action="eliminar-comentario"]', modal).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = parseInt(btn.dataset.comentarioId);
        ticket.comentarios = ticket.comentarios.filter(c => c.id !== cid);
        showToast('Comentario eliminado', 'info');
        openTicketModal(ticketId);
      });
    });

    // ---- FIX #5: Checklist crear / agregar / toggle / eliminar ----
    $('[data-form="crear-checklist"]', modal).addEventListener('submit', (e) => {
      e.preventDefault();
      const titulo = $('input[name="titulo"]', e.target).value.trim();
      if (!titulo) return;
      const newCL = { id: nextId(ticket.checklists), titulo, items: [] };
      ticket.checklists.push(newCL);
      showToast('Checklist creado correctamente', 'success');
      openTicketModal(ticketId);
    });

    $$('[data-form="agregar-item"]', modal).forEach(form => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const clid = parseInt(form.dataset.checklistId);
        const texto = $('input[name="texto"]', form).value.trim();
        if (!texto) return;
        const cl = ticket.checklists.find(c => c.id === clid);
        if (!cl) return;
        cl.items.push({ id: nextId(cl.items), texto, completado: false });
        showToast('Tarea agregada al checklist', 'success');
        openTicketModal(ticketId);
      });
    });

    $$('[data-action="toggle-item"]', modal).forEach(cb => {
      cb.addEventListener('change', (e) => {
        const clid = parseInt(cb.dataset.checklistId);
        const iid = parseInt(cb.dataset.itemId);
        const cl = ticket.checklists.find(c => c.id === clid);
        if (!cl) return;
        const item = cl.items.find(i => i.id === iid);
        if (!item) return;
        item.completado = cb.checked;
        showToast('Tarea actualizada', 'info');
        // Solo re-render parcial: actualizar visualmente
        const span = cb.parentElement.querySelector('span');
        if (cb.checked) { span.classList.add('line-through', 'text-slate-400'); span.classList.remove('text-slate-700'); }
        else { span.classList.remove('line-through', 'text-slate-400'); span.classList.add('text-slate-700'); }
      });
    });

    $$('[data-action="eliminar-item"]', modal).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const clid = parseInt(btn.dataset.checklistId);
        const iid = parseInt(btn.dataset.itemId);
        const cl = ticket.checklists.find(c => c.id === clid);
        if (!cl) return;
        cl.items = cl.items.filter(i => i.id !== iid);
        showToast('Tarea eliminada del checklist', 'info');
        openTicketModal(ticketId);
      });
    });

    $$('[data-action="eliminar-checklist"]', modal).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const clid = parseInt(btn.dataset.checklistId);
        ticket.checklists = ticket.checklists.filter(c => c.id !== clid);
        showToast('Checklist eliminado', 'info');
        openTicketModal(ticketId);
      });
    });

    // ---- FIX #3: Adjuntos (drag & drop) ----
    // Manejado en reinitModalExtras()

    $$('[data-action="eliminar-adjunto"]', modal).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const aid = parseInt(btn.dataset.adjuntoId);
        ticket.adjuntos = ticket.adjuntos.filter(a => a.id !== aid);
        showToast('Adjunto eliminado', 'info');
        openTicketModal(ticketId);
      });
    });

    // ---- FIX #6: Etiquetas ----
    $('[data-action="agregar-etiqueta"]', modal).addEventListener('change', (e) => {
      const etid = parseInt(e.target.value);
      if (!etid) return;
      if (!ticket.etiquetas.includes(etid)) {
        ticket.etiquetas.push(etid);
        const et = findEtiqueta(etid);
        showToast(`Etiqueta "${et.nombre}" agregada al ticket`, 'success');
        e.target.value = '';
        openTicketModal(ticketId);
      }
    });

    $$('[data-action="quitar-etiqueta"]', modal).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const etid = parseInt(btn.dataset.etiquetaId);
        ticket.etiquetas = ticket.etiquetas.filter(id => id !== etid);
        const et = findEtiqueta(etid);
        showToast(`Etiqueta "${et.nombre}" quitada del ticket`, 'info');
        openTicketModal(ticketId);
      });
    });

    $('[data-action="abrir-gestionar-etiquetas"]', modal).addEventListener('click', () => {
      openGestionarEtiquetasModal();
    });

    // ---- FIX #4: Duplicar ticket ----
    $('[data-action="duplicar-ticket"]', modal).addEventListener('click', async (e) => {
      e.stopPropagation();
      const newTicket = {
        ...JSON.parse(JSON.stringify(ticket)),
        id: nextId(state.tickets),
        codigo: `GRM-INC-2026-${String(nextId(state.tickets)).padStart(6, '0')}`,
        titulo: ticket.titulo + ' (Copia)',
        estado_id: 1,
        comentarios: [], adjuntos: [], checklists: [],
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' ')
      };
      state.tickets.push(newTicket);
      showToast(`Ticket duplicado: ${newTicket.codigo}`, 'success');
      closeModal();
    });
  }

  // =================================================================
  // MODAL GESTIONAR ETIQUETAS
  // =================================================================
  function openGestionarEtiquetasModal() {
    const root = $('#modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/50 modal-backdrop" data-modal="gestionar-etiquetas">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 p-5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-800">Gestionar etiquetas</h3>
            <button data-close-modal class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-slate-600">×</button>
          </div>
          <form data-form="nueva-etiqueta" class="flex gap-2 mb-3">
            <input type="text" name="nombre" required placeholder="Nombre" class="flex-1 text-xs px-2 py-1.5 border border-slate-300 rounded" />
            <input type="color" name="color" value="#6366f1" class="w-10 h-8 border border-slate-300 rounded cursor-pointer" />
            <button type="submit" class="text-[11px] px-3 py-1.5 bg-indigo-600 text-white rounded hover:bg-indigo-700">+ Crear</button>
          </form>
          <div class="space-y-1.5 max-h-72 overflow-y-auto">
            ${state.etiquetas.map(e => `
              <div class="flex items-center justify-between p-2 bg-slate-50 rounded group">
                <div class="flex items-center gap-2">
                  <span class="label-chip" style="background-color: ${e.color}">${escape(e.nombre)}</span>
                </div>
                <button data-action="eliminar-etiqueta-global" data-etiqueta-id="${e.id}" class="text-[10px] text-slate-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity">
                  Eliminar
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
    const modal = $('[data-modal="gestionar-etiquetas"]');
    modal.addEventListener('click', (e) => {
      if (e.target.matches('[data-close-modal]') || e.target.classList.contains('modal-backdrop')) {
        // Volver al detalle
        const ticketId = parseInt($('[data-modal="detalle-ticket"]')?.dataset.ticketId || 1);
        openTicketModal(ticketId);
      }
    });
    $('[data-form="nueva-etiqueta"]', modal).addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = $('input[name="nombre"]', e.target).value.trim();
      const color = $('input[name="color"]', e.target).value;
      if (!nombre) return;
      state.etiquetas.push({ id: nextId(state.etiquetas), nombre, color });
      showToast(`Etiqueta "${nombre}" creada`, 'success');
      openGestionarEtiquetasModal();
    });
    $$('[data-action="eliminar-etiqueta-global"]', modal).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const etid = parseInt(btn.dataset.etiquetaId);
        state.etiquetas = state.etiquetas.filter(x => x.id !== etid);
        // Quitar de todos los tickets
        state.tickets.forEach(t => t.etiquetas = t.etiquetas.filter(id => id !== etid));
        showToast('Etiqueta eliminada del sistema', 'info');
        openGestionarEtiquetasModal();
      });
    });
  }

  // =================================================================
  // FIX #3: DROPZONE DE ADJUNTOS (con drag & drop)
  // =================================================================
  function setupAdjuntosDropzone() {
    $$('.drop-zone').forEach(drop => {
      if (drop.dataset.dzInit === '1') return;
      drop.dataset.dzInit = '1';
      const ticketId = parseInt(drop.dataset.ticketId);
      const ticket = findTicket(ticketId);
      if (!ticket) return;
      const fileInput = $(`#adjunto-file-${ticketId}`);
      const preview = $(`#adjuntos-preview-${ticketId}`);
      const info = $(`#adjuntos-info-${ticketId}`);
      let pendingFiles = [];

      // Click en dropzone abre file picker
      drop.addEventListener('click', (e) => {
        if (e.target === fileInput) return;
        fileInput.click();
      });

      // Drag visual
      ['dragenter', 'dragover'].forEach(ev => {
        drop.addEventListener(ev, (e) => {
          e.preventDefault();
          e.stopPropagation();
          drop.classList.add('drag-over');
        });

      });

      });

        if (pendingFiles.length === 0) {

          info.textContent = '';

        pendingFiles.forEach(f => {

          items.push(`
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-white border border-slate-200 text-[10px]">

          });
          pendingFiles = [];
