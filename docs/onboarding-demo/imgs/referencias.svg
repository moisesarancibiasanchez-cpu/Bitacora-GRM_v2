<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Referencias entre tickets: seis tipos de relación con tres tickets conectados">
  <rect width="720" height="400" rx="8" fill="#f1f5f9"/>

  <text x="24" y="28" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Referencias entre tickets</text>
  <text x="24" y="44" font-family="system-ui" font-size="10" fill="#64748b">El ticket origen declara qué ticket referencia, y el tipo explica la relación.</text>

  <!-- Ticket origen -->
  <rect x="24" y="62" width="164" height="96" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="24" y="62" width="164" height="20" rx="8" fill="#4f46e5"/>
  <rect x="24" y="74" width="164" height="8" fill="#4f46e5"/>
  <text x="34" y="76" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">#128 · Origen</text>
  <text x="34" y="100" font-family="system-ui" font-size="10" font-weight="600" fill="#1e293b">Login falla tras</text>
  <text x="34" y="114" font-family="system-ui" font-size="10" font-weight="600" fill="#1e293b">actualizar</text>
  <rect x="34" y="126" width="58" height="16" rx="8" fill="#fef3c7"/>
  <text x="63" y="138" font-family="system-ui" font-size="9" text-anchor="middle" fill="#92400e" font-weight="600">bloquea</text>
  <path d="M124 134 L176 176" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Ticket duplicado -->
  <rect x="182" y="160" width="164" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="182" y="160" width="164" height="20" rx="8" fill="#64748b"/>
  <rect x="182" y="172" width="164" height="8" fill="#64748b"/>
  <text x="192" y="174" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">#131 · Referido</text>
  <text x="192" y="198" font-family="system-ui" font-size="10" font-weight="600" fill="#1e293b">No puedo entrar</text>
  <text x="192" y="212" font-family="system-ui" font-size="10" font-weight="600" fill="#1e293b">a la plataforma</text>
  <rect x="192" y="224" width="72" height="16" rx="8" fill="#fee2e2"/>
  <text x="228" y="236" font-family="system-ui" font-size="9" text-anchor="middle" fill="#991b1b" font-weight="600">duplicado de</text>
  <path d="M346 196 L468 132" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Ticket padre -->
  <rect x="474" y="62" width="222" height="96" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="474" y="62" width="222" height="20" rx="8" fill="#16a34a"/>
  <rect x="474" y="74" width="222" height="8" fill="#16a34a"/>
  <text x="484" y="76" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">#95 · Padre (epica de acceso)</text>
  <text x="484" y="100" font-family="system-ui" font-size="10" font-weight="600" fill="#1e293b">Restablecer contrasena y</text>
  <text x="484" y="114" font-family="system-ui" font-size="10" font-weight="600" fill="#1e293b">control de sesiones</text>
  <rect x="484" y="126" width="52" height="16" rx="8" fill="#dcfce7"/>
  <text x="510" y="138" font-family="system-ui" font-size="9" text-anchor="middle" fill="#166534" font-weight="600">padre de</text>
  <path d="M474 148 L360 176" stroke="#166534" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M300 256 L300 300 L598 300 L598 160" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow)"/>
  <rect x="360" y="288" width="170" height="24" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="445" y="304" font-family="system-ui" font-size="10" text-anchor="middle" fill="#5b21b6" font-weight="600">bloqueado por #95</text>

  <!-- Catalogo de tipos -->
  <rect x="24" y="276" width="312" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="298" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Los seis tipos disponibles</text>

  <rect x="40" y="308" width="86" height="18" rx="9" fill="#e0e7ff"/>
  <text x="83" y="321" font-family="system-ui" font-size="9" text-anchor="middle" fill="#3730a3" font-weight="600">relacionado</text>
  <rect x="132" y="308" width="78" height="18" rx="9" fill="#fee2e2"/>
  <text x="171" y="321" font-family="system-ui" font-size="9" text-anchor="middle" fill="#991b1b" font-weight="600">duplicado</text>
  <rect x="216" y="308" width="56" height="18" rx="9" fill="#dcfce7"/>
  <text x="244" y="321" font-family="system-ui" font-size="9" text-anchor="middle" fill="#166534" font-weight="600">padre</text>

  <rect x="40" y="332" width="56" height="18" rx="9" fill="#dcfce7"/>
  <text x="68" y="345" font-family="system-ui" font-size="9" text-anchor="middle" fill="#166534" font-weight="600">hijo</text>
  <rect x="102" y="332" width="66" height="18" rx="9" fill="#fef3c7"/>
  <text x="135" y="345" font-family="system-ui" font-size="9" text-anchor="middle" fill="#92400e" font-weight="600">bloquea</text>
  <rect x="174" y="332" width="98" height="18" rx="9" fill="#ede9fe"/>
  <text x="223" y="345" font-family="system-ui" font-size="9" text-anchor="middle" fill="#5b21b6" font-weight="600">bloqueado por</text>

  <text x="40" y="366" font-family="system-ui" font-size="9" fill="#64748b">Relacionado y duplicado son simetricas. Padre e hijo, y bloquea y</text>
  <text x="40" y="378" font-family="system-ui" font-size="9" fill="#64748b">bloqueado por, son inversas entre si.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>