<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITSM/Kanban MVP · Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z'/%3E%3C/svg%3E" />
    <style>
        .kanban-column { min-height: 60vh; }
        .kanban-ticket { cursor: grab; }
        .kanban-ticket.dragging { opacity: 0.5; transform: rotate(2deg); }
        .kanban-column.drag-over { background-color: rgba(37, 99, 235, 0.05); border-color: #2563eb; }
        .priority-badge { font-size: 0.65rem; padding: 0.1rem 0.4rem; }
        .sla-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .sla-ok { background-color: #16a34a; }
        .sla-warn { background-color: #f59e0b; }
        .sla-overdue { background-color: #dc2626; }
        .sla-unknown { background-color: #94a3b8; }
        [data-toast] { transition: opacity 0.2s; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-14">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 text-slate-900 font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
                    </svg>
                    ITSM/Kanban MVP
                </div>
                <span class="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-mono">DEMO STATIC</span>
            </div>
            <div class="flex items-center gap-3 text-sm">
                <span class="text-slate-500">Usuario:</span>
                <span class="font-medium text-slate-800" id="nav-username">admin</span>
                <span class="px-2 py-0.5 text-xs rounded-full bg-blue-100 text-blue-800" id="nav-rol">ADMINISTRADOR</span>
                <button onclick="resetDemo()" class="text-slate-500 hover:text-blue-600 text-sm">Reiniciar demo</button>
            </div>
        </div>
    </nav>

    <!-- Banner informativo -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
        <div class="bg-blue-50 border border-blue-200 text-blue-800 text-sm rounded px-4 py-2 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>Demo funcional. Las transiciones se validan según la matriz <code class="px-1 bg-blue-100 rounded">transiciones</code> del backend real. Persistencia con localStorage.</span>
        </div>
    </div>

    <!-- Tablero -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-bold text-slate-900">Tablero Kanban</h1>
            <button onclick="abrirModalNuevo()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Nuevo ticket
            </button>
        </div>

        <div id="tablero" class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">
            <!-- Las columnas se inyectan via JS -->
        </div>
    </main>

    <!-- Toast -->
    <div id="kanban-toast" class="hidden fixed bottom-4 right-4 bg-rose-600 text-white px-4 py-2 rounded shadow-lg z-50"></div>

    <!-- Modal: Nuevo ticket -->
    <div id="modal-nuevo" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h2 class="text-lg font-semibold mb-3">Crear nuevo ticket</h2>
            <form id="form-nuevo" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Título</label>
                    <input name="titulo" required class="w-full px-3 py-2 border border-slate-300 rounded text-sm" placeholder="ej. Error de login en la app" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
                    <textarea name="descripcion" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Prioridad</label>
                        <select name="prioridad" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                            <option value="BAJA">Baja</option>
                            <option value="MEDIA" selected>Media</option>
                            <option value="ALTA">Alta</option>
                            <option value="CRITICA">Crítica</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Origen</label>
                        <select name="origen" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                            <option value="USUARIO">Usuario</option>
                            <option value="MONITOREO">Monitoreo</option>
                            <option value="AUDITORIA">Auditoría</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="cerrarModalNuevo()" class="px-3 py-1.5 text-slate-600 hover:text-slate-900 text-sm">Cancelar</button>
                    <button type="submit" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Detalle / Auditoría -->
    <div id="modal-detalle" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                <h2 id="detalle-titulo" class="text-lg font-semibold">Detalle del ticket</h2>
                <button onclick="cerrarModalDetalle()" class="text-slate-500 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto" id="detalle-cuerpo">
                <!-- Contenido inyectado por JS -->
            </div>
        </div>
    </div>

    <script>
    // ==================== MODELO DE DATOS ====================
    const ESTADOS = [
        { id: 1, nombre: "Pendiente",    orden: 1, color: "#64748b", categoria: "PENDIENTE" },
        { id: 2, nombre: "En curso",     orden: 2, color: "#2563eb", categoria: "EN_PROGRESO" },
        { id: 3, nombre: "Bloqueado",    orden: 3, color: "#dc2626", categoria: "BLOQUEADO" },
        { id: 4, nombre: "Resuelto",     orden: 4, color: "#16a34a", categoria: "RESUELTO" },
        { id: 5, nombre: "Cerrado",      orden: 5, color: "#475569", categoria: "CERRADO" },
        { id: 6, nombre: "Cancelado",    orden: 6, color: "#9ca3af", categoria: "CANCELADO" },
    ];

    // Matriz de transiciones legales (origen_id, destino_id) → {rol_requerido, requiere_comentario, nombre}
    const TRANSICIONES = {
        "1->2": { nombre: "Iniciar",       rol_requerido: "AGENTE",        requiere_comentario: false },
        "1->3": { nombre: "Bloquear",      rol_requerido: "AGENTE",        requiere_comentario: true  },
        "1->6": { nombre: "Cancelar",      rol_requerido: "AGENTE_SENIOR", requiere_comentario: true  },
        "2->3": { nombre: "Bloquear",      rol_requerido: "AGENTE",        requiere_comentario: true  },
        "2->4": { nombre: "Resolver",      rol_requerido: "AGENTE",        requiere_comentario: false },
        "2->6": { nombre: "Cancelar",      rol_requerido: "AGENTE_SENIOR", requiere_comentario: true  },
        "3->2": { nombre: "Desbloquear",   rol_requerido: "AGENTE",        requiere_comentario: false },
        "3->6": { nombre: "Cancelar",      rol_requerido: "AGENTE_SENIOR", requiere_comentario: true  },
        "4->5": { nombre: "Cerrar",        rol_requerido: "AGENTE_SENIOR", requiere_comentario: true  },
        "4->2": { nombre: "Reabrir",       rol_requerido: "AGENTE_SENIOR", requiere_comentario: true  },
    };

    const ROL_NIVELES = {
        "OBSERVADOR":    0,
        "SOLICITANTE":   1,
        "AGENTE":        2,
        "AGENTE_SENIOR": 3,
        "ADMINISTRADOR": 4,
    };

    const SLA_MINUTOS = {
        "BAJA":    60 * 24 * 5,
        "MEDIA":   60 * 24 * 2,
        "ALTA":    60 * 4,
        "CRITICA": 60,
    };

    // ==================== ESTADO ====================
    const LS_KEY = "itsm_kanban_mvp_demo";
    let state = null;

    function defaultState() {
        const ahora = new Date();
        return {
            tickets: [
                { id: 1, codigo: "TKT-00001", titulo: "Error 500 en /api/login",   descripcion: "Tras deploy, login devuelve 500.", estado_id: 1, prioridad: "ALTA",    creador: "admin", asignado: null, created_at: new Date(ahora - 86400000*2).toISOString(), posicion: 0, comentarios: [] },
                { id: 2, codigo: "TKT-00002", titulo: "Migrar BD a v2",            descripcion: "Schema migration plan",                  estado_id: 2, prioridad: "MEDIA",   creador: "admin", asignado: "agente1", created_at: new Date(ahora - 86400000*5).toISOString(), posicion: 0, comentarios: [] },
                { id: 3, codigo: "TKT-00003", titulo: "Bloqueado por VPN",         descripcion: "Equipo no puede acceder al repo",        estado_id: 3, prioridad: "ALTA",    creador: "admin", asignado: "agente2", created_at: new Date(ahora - 86400000*1).toISOString(), posicion: 0, comentarios: [] },
                { id: 4, codigo: "TKT-00004", titulo: "Logo nuevo en homepage",    descripcion: "Marketing pidió cambio",                 estado_id: 2, prioridad: "BAJA",    creador: "admin", asignado: "agente1", created_at: new Date(ahora - 86400000*3).toISOString(), posicion: 1, comentarios: [] },
                { id: 5, codigo: "TKT-00005", titulo: "Caída del servicio mail",   descripcion: "SMTP rechaza conexiones",                estado_id: 4, prioridad: "CRITICA", creador: "admin", asignado: "agente1", created_at: new Date(ahora - 86400000*4).toISOString(), posicion: 0, comentarios: [] },
                { id: 6, codigo: "TKT-00006", titulo: "Mejorar performance API",   descripcion: "P95 en 1.2s, objetivo <500ms",          estado_id: 1, prioridad: "MEDIA",   creador: "admin", asignado: null, created_at: new Date(ahora - 3600000*6).toISOString(), posicion: 1, comentarios: [] },
            ],
            auditoria: [],
            seq_ticket: 7,
            seq_evento: 1,
            current_user: { username: "admin", rol: "ADMINISTRADOR" },
        };
    }

    function loadState() {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) {
            try { state = JSON.parse(raw); return; } catch(e) {}
        }
        state = defaultState();
        // Eventos iniciales (seed de auditoría)
        state.tickets.forEach(t => {
            state.auditoria.push({
                id: state.seq_evento++,
                ticket_id: t.id,
                tipo: "CREADO",
                actor: "admin",
                valor_anterior: null,
                valor_nuevo: JSON.stringify({ estado_id: t.estado_id, prioridad: t.prioridad }),
                comentario: "Ticket creado",
                created_at: t.created_at,
            });
        });
        saveState();
    }
    function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    function resetDemo() { localStorage.removeItem(LS_KEY); loadState(); renderTablero(); toast("Demo reiniciada", "ok"); }

    // ==================== RENDER ====================
    function fmtFecha(iso) {
        const d = new Date(iso);
        return d.toLocaleString("es", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function minutosRestantes(prioridad, created_at) {
        const total = SLA_MINUTOS[prioridad] || (60*24);
        const elapsed = (Date.now() - new Date(created_at).getTime()) / 60000;
        return Math.round(total - elapsed);
    }
    function claseSla(prioridad, created_at) {
        const r = minutosRestantes(prioridad, created_at);
        if (r < 0) return "sla-overdue";
        if (r < 60) return "sla-warn";
        return "sla-ok";
    }
    function colorPrioridad(p) {
        return { BAJA: "#64748b", MEDIA: "#2563eb", ALTA: "#f59e0b", CRITICA: "#dc2626" }[p] || "#94a3b8";
    }

    function renderTablero() {
        const tablero = document.getElementById("tablero");
        tablero.innerHTML = "";
        ESTADOS.forEach(est => {
            const col = document.createElement("div");
            col.className = "kanban-column bg-white border border-slate-200 rounded-lg p-3 flex flex-col";
            col.dataset.estadoId = est.id;
            const tickets = state.tickets.filter(t => t.estado_id === est.id).sort((a, b) => a.posicion - b.posicion);
            col.innerHTML = `
                <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full" style="background:${est.color}"></span>
                        <h2 class="text-sm font-semibold text-slate-700">${est.nombre}</h2>
                    </div>
                    <span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">${tickets.length}</span>
                </div>
                <div class="tickets-list flex-1 space-y-2 min-h-[40vh]" data-estado="${est.id}">
                    ${tickets.map(t => tarjetaHTML(t)).join("")}
                </div>
            `;
            tablero.appendChild(col);
        });

        // Inicializar SortableJS en cada columna
        document.querySelectorAll(".tickets-list").forEach(el => {
            new Sortable(el, {
                group: "kanban",
                animation: 150,
                ghostClass: "dragging",
                onEnd: onDropTicket,
            });
        });
    }

    function tarjetaHTML(t) {
        const slaClass = claseSla(t.prioridad, t.created_at);
        const minutos = minutosRestantes(t.prioridad, t.created_at);
        const slaText = minutos < 0 ? `Vencido ${-minutos}m` : `${minutos}m restantes`;
        return `
        <div class="kanban-ticket bg-white border border-slate-200 rounded-md p-2.5 shadow-sm hover:shadow" data-ticket-id="${t.id}">
            <div class="flex items-center justify-between mb-1.5">
                <span class="text-[10px] font-mono text-slate-500">${t.codigo}</span>
                <span class="priority-badge rounded font-bold text-white" style="background:${colorPrioridad(t.prioridad)}">${t.prioridad}</span>
            </div>
            <p class="text-sm font-medium text-slate-900 mb-1.5 leading-tight">${escapeHtml(t.titulo)}</p>
            <div class="flex items-center justify-between text-[11px] text-slate-500">
                <div class="flex items-center gap-1">
                    <span class="sla-dot ${slaClass}"></span>
                    <span>SLA: ${slaText}</span>
                </div>
                <button onclick="abrirDetalle(${t.id})" class="text-blue-600 hover:underline">ver</button>
            </div>
            ${t.asignado ? `<div class="text-[10px] text-slate-400 mt-1">→ ${t.asignado}</div>` : ""}
        </div>`;
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ==================== LÓGICA ITSM ====================
    function onDropTicket(evt) {
        const ticketId = parseInt(evt.item.dataset.ticketId);
        const estadoIdDestino = parseInt(evt.to.dataset.estado);
        const ticket = state.tickets.find(t => t.id === ticketId);
        if (!ticket) return;

        if (ticket.estado_id === estadoIdDestino) {
            // Reordenar dentro de la misma columna
            ticket.posicion = evt.newIndex;
            saveState();
            return;
        }

        // Validar transición
        const key = `${ticket.estado_id}->${estadoIdDestino}`;
        const transicion = TRANSICIONES[key];
        if (!transicion) {
            toast(`❌ Transición ILEGAL ${key} (no existe regla)`, "error");
            renderTablero();
            return;
        }

        // Validar rol
        const nivelUsuario = ROL_NIVELES[state.current_user.rol];
        const nivelRequerido = ROL_NIVELES[transicion.rol_requerido];
        if (nivelUsuario < nivelRequerido) {
            toast(`❌ Permiso insuficiente: se requiere ${transicion.rol_requerido}, tienes ${state.current_user.rol}`, "error");
            renderTablero();
            return;
        }

        // Validar comentario
        let comentario = "";
        if (transicion.requiere_comentario) {
            comentario = prompt(`Transición «${transicion.nombre}» requiere comentario de justificación:`) || "";
            if (!comentario.trim()) {
                toast("❌ Comentario obligatorio para esta transición", "error");
                renderTablero();
                return;
            }
        }

        // Aplicar cambio + auditoría
        const estadoOrigen = ESTADOS.find(e => e.id === ticket.estado_id);
        const estadoDestino = ESTADOS.find(e => e.id === estadoIdDestino);
        ticket.estado_id = estadoIdDestino;
        ticket.posicion = evt.newIndex;
        state.auditoria.push({
            id: state.seq_evento++,
            ticket_id: ticket.id,
            tipo: "ESTADO_CAMBIADO",
            actor: state.current_user.username,
            valor_anterior: JSON.stringify({ estado: estadoOrigen.nombre, posicion: ticket.posicion }),
            valor_nuevo: JSON.stringify({ estado: estadoDestino.nombre, transicion: transicion.nombre }),
            comentario,
            created_at: new Date().toISOString(),
        });
        saveState();
        toast(`✅ ${ticket.codigo}: ${estadoOrigen.nombre} → ${estadoDestino.nombre} (${transicion.nombre})`, "ok");
    }

    // ==================== UI HELPERS ====================
    function toast(msg, tipo) {
        const t = document.getElementById("kanban-toast");
        t.textContent = msg;
        t.className = `fixed bottom-4 right-4 px-4 py-2 rounded shadow-lg z-50 text-white ${tipo === "ok" ? "bg-emerald-600" : "bg-rose-600"}`;
        setTimeout(() => { t.className = "hidden fixed bottom-4 right-4 bg-rose-600 text-white px-4 py-2 rounded shadow-lg z-50"; }, 4500);
    }

    function abrirModalNuevo() { document.getElementById("modal-nuevo").classList.remove("hidden"); }
    function cerrarModalNuevo() { document.getElementById("modal-nuevo").classList.add("hidden"); document.getElementById("form-nuevo").reset(); }

    document.getElementById("form-nuevo").addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const id = state.seq_ticket++;
        const codigo = `TKT-${String(id).padStart(5, "0")}`;
        const ticket = {
            id, codigo,
            titulo: fd.get("titulo"),
            descripcion: fd.get("descripcion"),
            estado_id: 1,
            prioridad: fd.get("prioridad"),
            origen: fd.get("origen"),
            creador: state.current_user.username,
            asignado: null,
            created_at: new Date().toISOString(),
            posicion: state.tickets.filter(t => t.estado_id === 1).length,
            comentarios: [],
        };
        state.tickets.push(ticket);
        state.auditoria.push({
            id: state.seq_evento++,
            ticket_id: id,
            tipo: "CREADO",
            actor: state.current_user.username,
            valor_anterior: null,
            valor_nuevo: JSON.stringify({ estado: "Pendiente", prioridad: ticket.prioridad }),
            comentario: `Ticket creado desde ${ticket.origen}`,
            created_at: ticket.created_at,
        });
        saveState();
        cerrarModalNuevo();
        renderTablero();
        toast(`✅ ${codigo} creado`, "ok");
    });

    function abrirDetalle(id) {
        const t = state.tickets.find(t => t.id === id);
        if (!t) return;
        const estado = ESTADOS.find(e => e.id === t.estado_id);
        const eventos = state.auditoria.filter(a => a.ticket_id === id).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        document.getElementById("detalle-titulo").textContent = `${t.codigo} · ${t.titulo}`;
        document.getElementById("detalle-cuerpo").innerHTML = `
            <div class="grid grid-cols-2 gap-3 text-sm mb-4">
                <div><span class="text-slate-500">Estado:</span> <strong>${estado.nombre}</strong></div>
                <div><span class="text-slate-500">Prioridad:</span> <strong style="color:${colorPrioridad(t.prioridad)}">${t.prioridad}</strong></div>
                <div><span class="text-slate-500">Creador:</span> ${t.creador}</div>
                <div><span class="text-slate-500">Asignado:</span> ${t.asignado || "—"}</div>
                <div class="col-span-2"><span class="text-slate-500">Descripción:</span><p class="text-slate-700 mt-1">${escapeHtml(t.descripcion || "(sin descripción)")}</p></div>
            </div>
            <h3 class="text-sm font-semibold text-slate-700 mb-2 border-b border-slate-200 pb-1">Auditoría (${eventos.length} eventos)</h3>
            <div class="space-y-2">
                ${eventos.map(e => `
                    <div class="text-xs border-l-2 pl-2 py-1" style="border-color:${e.tipo === "CREADO" ? "#16a34a" : "#2563eb"}">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold">${e.tipo}</span>
                            <span class="text-slate-500">${fmtFecha(e.created_at)}</span>
                        </div>
                        <div class="text-slate-600">por <strong>${e.actor}</strong></div>
