<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Selector de vistas con siete modos: tablero, tabla, calendario, linea de tiempo, gantt, panel y planificador">
  <rect width="720" height="400" rx="8" fill="#f1f5f9"/>

  <text x="24" y="28" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Selector de vistas</text>
  <text x="24" y="44" font-family="system-ui" font-size="10" fill="#64748b">Siete lecturas del mismo conjunto de tickets. Cambiar de vista no crea ni modifica datos.</text>

  <!-- Barra del selector -->
  <rect x="24" y="58" width="672" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="82" font-family="system-ui" font-size="10" font-weight="600" fill="#64748b">Vista</text>

  <rect x="156" y="66" width="70" height="24" rx="6" fill="#4f46e5"/>
  <text x="191" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="600">Tablero</text>
  <rect x="232" y="66" width="58" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="261" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#475569" font-weight="600">Tabla</text>
  <rect x="296" y="66" width="76" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="334" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#475569" font-weight="600">Calendario</text>
  <rect x="378" y="66" width="100" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="428" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#475569" font-weight="600">Linea de tiempo</text>
  <rect x="484" y="66" width="56" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="512" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#475569" font-weight="600">Gantt</text>
  <rect x="546" y="66" width="84" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="588" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#475569" font-weight="600">Planificador</text>
  <rect x="636" y="66" width="58" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="665" y="82" font-family="system-ui" font-size="10" text-anchor="middle" fill="#475569" font-weight="600">Panel</text>

  <!-- Vista Tablero -->
  <rect x="24" y="110" width="216" height="150" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="40" y="130" font-family="system-ui" font-size="10" font-weight="700" fill="#4f46e5">Tablero (Kanban)</text>
  <rect x="38" y="140" width="56" height="110" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="102" y="140" width="56" height="110" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="166" y="140" width="56" height="110" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="44" y="150" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="44" y="180" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="108" y="150" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="172" y="150" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="172" y="180" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="240" font-family="system-ui" font-size="9" fill="#64748b">arrastrar tarjetas</text>

  <!-- Vista Tabla -->
  <rect x="252" y="110" width="216" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="268" y="130" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Tabla</text>
  <rect x="266" y="140" width="188" height="18" rx="3" fill="#e2e8f0"/>
  <text x="272" y="153" font-family="system-ui" font-size="8" font-weight="700" fill="#475569">ID</text>
  <text x="306" y="153" font-family="system-ui" font-size="8" font-weight="700" fill="#475569">Titulo</text>
  <text x="392" y="153" font-family="system-ui" font-size="8" font-weight="700" fill="#475569">Estado</text>
  <line x1="266" y1="164" x2="454" y2="164" stroke="#e2e8f0"/>
  <line x1="266" y1="186" x2="454" y2="186" stroke="#f1f5f9"/>
  <line x1="266" y1="208" x2="454" y2="208" stroke="#f1f5f9"/>
  <line x1="266" y1="230" x2="454" y2="230" stroke="#f1f5f9"/>
  <text x="272" y="178" font-family="system-ui" font-size="8" fill="#334155">128</text>
  <text x="306" y="178" font-family="system-ui" font-size="8" fill="#334155">Login falla</text>
  <text x="272" y="200" font-family="system-ui" font-size="8" fill="#334155">131</text>
  <text x="306" y="200" font-family="system-ui" font-size="8" fill="#334155">No puedo entrar</text>
  <text x="272" y="222" font-family="system-ui" font-size="8" fill="#334155">140</text>
  <text x="306" y="222" font-family="system-ui" font-size="8" fill="#334155">Error de sesion</text>
  <text x="268" y="250" font-family="system-ui" font-size="9" fill="#64748b">ordenar por cualquier columna</text>

  <!-- Vista Calendario -->
  <rect x="480" y="110" width="216" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="496" y="130" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Calendario</text>
  <rect x="494" y="140" width="188" height="18" rx="3" fill="#e2e8f0"/>
  <text x="500" y="153" font-family="system-ui" font-size="8" font-weight="700" fill="#475569">Sem 44</text>
  <text x="576" y="153" font-family="system-ui" font-size="8" font-weight="700" fill="#475569">Sem 45</text>
  <rect x="500" y="166" width="54" height="30" rx="4" fill="#eef2ff"/>
  <rect x="562" y="176" width="54" height="30" rx="4" fill="#fef3c7"/>
  <rect x="624" y="166" width="54" height="30" rx="4" fill="#dcfce7"/>
  <text x="508" y="180" font-family="system-ui" font-size="8" fill="#3730a3" font-weight="600">#128</text>
  <text x="570" y="190" font-family="system-ui" font-size="8" fill="#92400e" font-weight="600">#131</text>
  <text x="632" y="180" font-family="system-ui" font-size="8" fill="#166534" font-weight="600">#140</text>
  <rect x="500" y="204" width="54" height="30" rx="4" fill="#fee2e2"/>
  <text x="508" y="218" font-family="system-ui" font-size="8" fill="#991b1b" font-weight="600">#145</text>
  <text x="496" y="250" font-family="system-ui" font-size="9" fill="#64748b">por fecha de vencimiento</text>

  <!-- Linea de tiempo -->
  <rect x="24" y="272" width="162" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="292" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Linea de tiempo</text>
  <text x="40" y="307" font-family="system-ui" font-size="8" fill="#64748b">Encadena dependencias</text>
  <rect x="40" y="316" width="52" height="18" rx="9" fill="#eef2ff"/>
  <text x="66" y="329" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">#95</text>
  <path d="M94 325 L104 325" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M100 321 L106 325 L100 329 Z" fill="#94a3b8"/>
  <rect x="108" y="316" width="52" height="18" rx="9" fill="#fef3c7"/>
  <text x="134" y="329" font-family="system-ui" font-size="8" text-anchor="middle" fill="#92400e" font-weight="600">#128</text>
  <path d="M162 325 L172 325" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M168 321 L174 325 L168 329 Z" fill="#94a3b8"/>
  <rect x="40" y="342" width="120" height="20" rx="10" fill="#dcfce7"/>
  <text x="100" y="356" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">#131 cierre</text>
  <text x="40" y="374" font-family="system-ui" font-size="8" fill="#64748b">Lee los tickets vinculados</text>

  <!-- Gantt -->
  <rect x="194" y="272" width="162" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="210" y="292" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Gantt</text>
  <text x="210" y="307" font-family="system-ui" font-size="8" fill="#64748b">Barras por fecha</text>
  <line x1="256" y1="316" x2="344" y2="316" stroke="#e2e8f0"/>
  <line x1="256" y1="336" x2="344" y2="336" stroke="#e2e8f0"/>
  <line x1="256" y1="356" x2="344" y2="356" stroke="#e2e8f0"/>
  <line x1="256" y1="316" x2="256" y2="362" stroke="#e2e8f0"/>
  <rect x="262" y="319" width="52" height="9" rx="4" fill="#6366f1"/>
  <rect x="290" y="339" width="42" height="9" rx="4" fill="#fbbf24"/>
  <rect x="272" y="359" width="60" height="9" rx="4" fill="#34d399"/>
  <text x="212" y="326" font-family="system-ui" font-size="7" fill="#64748b">#95</text>
  <text x="212" y="346" font-family="system-ui" font-size="7" fill="#64748b">#128</text>
  <text x="212" y="366" font-family="system-ui" font-size="7" fill="#64748b">#131</text>
  <text x="210" y="378" font-family="system-ui" font-size="7" fill="#64748b">Muestra las etapas de UAT</text>

  <!-- Planificador -->
  <rect x="364" y="272" width="162" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="292" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Planificador</text>
  <text x="380" y="307" font-family="system-ui" font-size="8" fill="#64748b">Capacidad por sprint</text>
  <rect x="380" y="316" width="130" height="13" rx="6" fill="#e2e8f0"/>
  <rect x="380" y="316" width="90" height="13" rx="6" fill="#4f46e5"/>
  <text x="425" y="326" font-family="system-ui" font-size="7" text-anchor="middle" fill="#ffffff" font-weight="700">69%</text>
  <rect x="380" y="334" width="130" height="13" rx="6" fill="#e2e8f0"/>
  <rect x="380" y="334" width="57" height="13" rx="6" fill="#a5b4fc"/>
  <rect x="380" y="352" width="130" height="13" rx="6" fill="#e2e8f0"/>
  <rect x="380" y="352" width="32" height="13" rx="6" fill="#fbbf24"/>
  <text x="380" y="378" font-family="system-ui" font-size="7" fill="#64748b">Compara lo comprometido con lo posible</text>

  <!-- Panel -->
  <rect x="534" y="272" width="162" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="550" y="292" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Panel</text>
  <text x="550" y="307" font-family="system-ui" font-size="8" fill="#64748b">Indicadores agrupados</text>
  <rect x="550" y="316" width="64" height="38" rx="5" fill="#eef2ff"/>
  <text x="582" y="334" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" fill="#3730a3">12</text>
  <text x="582" y="348" font-family="system-ui" font-size="7" text-anchor="middle" fill="#64748b">abiertos</text>
  <rect x="622" y="316" width="64" height="38" rx="5" fill="#fef3c7"/>
  <text x="654" y="334" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">4</text>
  <text x="654" y="348" font-family="system-ui" font-size="7" text-anchor="middle" fill="#64748b">vencidos</text>
  <text x="550" y="378" font-family="system-ui" font-size="7" fill="#64748b">Solo lectura, para informes rápidos</text>
</svg>