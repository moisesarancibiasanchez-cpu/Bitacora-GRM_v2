<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Pantalla de inicio de sesión">
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" rx="12" fill="url(#page)"/>
  <!-- Decorative grid -->
  <g opacity="0.18" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="80" x2="720" y2="80"/>
    <line x1="0" y1="160" x2="720" y2="160"/>
    <line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="320" x2="720" y2="320"/>
    <line x1="0" y1="400" x2="720" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
  </g>
  <!-- Browser chrome -->
  <rect x="40" y="40" width="640" height="400" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <rect x="40" y="40" width="640" height="36" rx="10" fill="#f1f5f9"/>
  <circle cx="60" cy="58" r="5" fill="#f87171"/>
  <circle cx="78" cy="58" r="5" fill="#fbbf24"/>
  <circle cx="96" cy="58" r="5" fill="#4ade80"/>
  <rect x="120" y="50" width="380" height="16" rx="4" fill="#e2e8f0"/>
  <text x="138" y="62" font-family="ui-monospace,monospace" font-size="11" fill="#475569">https://bitacora.empresa.com/login</text>
  <!-- Form card -->
  <rect x="220" y="120" width="280" height="280" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="360" y="160" font-family="system-ui" font-size="20" font-weight="700" text-anchor="middle" fill="#1e293b">Iniciar sesión</text>
  <text x="360" y="182" font-family="system-ui" font-size="11" text-anchor="middle" fill="#64748b">Accedé a tu tablero Kanban</text>
  <!-- Inputs -->
  <text x="250" y="214" font-family="system-ui" font-size="11" fill="#475569">Usuario o email</text>
  <rect x="250" y="220" width="220" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="266" cy="236" r="6" fill="#cbd5e1"/>
  <rect x="278" y="232" width="120" height="8" rx="2" fill="#cbd5e1"/>
  <text x="250" y="274" font-family="system-ui" font-size="11" fill="#475569">Contraseña</text>
  <rect x="250" y="280" width="220" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="262" y="294" width="100" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="446" cy="296" r="3" fill="#cbd5e1"/>
  <circle cx="455" cy="296" r="3" fill="#cbd5e1"/>
  <circle cx="464" cy="296" r="3" fill="#cbd5e1"/>
  <!-- Button -->
  <rect x="250" y="328" width="220" height="36" rx="6" fill="#4f46e5"/>
  <text x="360" y="351" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">Entrar</text>
  <text x="360" y="382" font-family="system-ui" font-size="11" text-anchor="middle" fill="#6366f1">¿No tenés cuenta? Regístrate aquí</text>
</svg>
