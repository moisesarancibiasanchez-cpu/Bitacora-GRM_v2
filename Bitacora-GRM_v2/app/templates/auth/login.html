{% extends "base.html" %}
{% block title %}Iniciar sesión · Bitácora GRM{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-indigo-50 p-4">
  <div class="w-full max-w-sm">
    <!-- Tarjeta de Login -->
    <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-6">
      <div class="text-center mb-5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mx-auto flex items-center justify-center mb-3 shadow-md">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c2.21 0 4-1.79 4-4S14.21 3 12 3 8 4.79 8 7s1.79 4 4 4zm0 2c-3.31 0-6 2.69-6 6v3h12v-3c0-3.31-2.69-6-6-6z"/>
          </svg>
        </div>
        <h1 class="text-lg font-semibold text-slate-800">Iniciar sesión</h1>
        <p class="text-xs text-slate-500 mt-1">Bitácora GRM · Módulo de Incidencias</p>
      </div>

      <div id="login-msg" class="mb-3"></div>

      <form hx-post="/api/v1/auth/login-form"
            hx-target="#login-msg" hx-swap="innerHTML"
            class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Usuario o Email</label>
          <input type="text" name="username" required autocomplete="username"
                 placeholder="ej. admin o usuario@empresa.cl"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
          <input type="password" name="password" required autocomplete="current-password"
                 placeholder="••••••••"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <button type="submit"
                class="w-full px-3 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-md text-sm font-semibold hover:from-indigo-700 hover:to-purple-700 transition-colors shadow-sm">
          <span class="htmx-indicator inline-block w-3 h-3 mr-1 align-middle border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          Entrar
        </button>
      </form>

      <div class="mt-4 pt-4 border-t border-slate-200 text-center">
        <p class="text-xs text-slate-500">
          ¿No tienes cuenta?
          <a href="/auth/registro" class="text-indigo-600 hover:text-indigo-700 font-semibold hover:underline">Regístrate aquí</a>
        </p>
      </div>
    </div>

    <p class="text-center text-[10px] text-slate-400 mt-4">
      Bitácora GRM v2 · ITSM + Kanban
    </p>
  </div>
</div>
{% endblock %}
