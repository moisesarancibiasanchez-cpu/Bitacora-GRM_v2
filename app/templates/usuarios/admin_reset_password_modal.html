<!--
  Modal: Cambiar contraseña de otro usuario (admin).
  Cargado por HTMX desde el botón "Cambiar contraseña" en la tabla de
  usuarios. El backend emite el evento `cambio-password-admin-ok` al
  cerrar con éxito (manejado en auth-events.js).
-->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
     role="dialog" aria-modal="true" aria-labelledby="admin-reset-pwd-titulo">
  <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 bg-gradient-to-r from-amber-50 to-rose-50">
      <div class="flex items-center gap-2">
        <span class="inline-flex w-8 h-8 rounded-full bg-gradient-to-br from-amber-500 to-rose-600 items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
        </span>
        <div>
          <h2 id="admin-reset-pwd-titulo" class="text-base font-semibold text-slate-800">Cambiar contraseña</h2>
          <p class="text-[11px] text-slate-500">Usuario: <span class="font-mono">@{{ usuario.username }}</span> · {{ usuario.nombre_completo }}</p>
        </div>
      </div>
      <button type="button"
              onclick="this.closest('[role=dialog]').remove()"
              class="text-slate-400 hover:text-slate-700 transition-colors p-1 rounded hover:bg-white/60"
              aria-label="Cerrar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="px-5 py-4">
      <p class="text-xs text-slate-500 mb-3">
        Define una nueva contraseña para este usuario. Debe tener entre
        6 y 128 caracteres y ser distinta a la actual.
      </p>

      <div id="admin-reset-pwd-msg"></div>

      <form hx-post="/api/v1/usuarios/{{ usuario.id }}/reset-password-form"
            hx-target="#admin-reset-pwd-msg" hx-swap="innerHTML"
            hx-on::after-request="
              if (event.detail.successful) {
                try { event.target.reset(); } catch (e) { /* noop */ }
              }
            "
            class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="arp-nuevo">
            Nueva contraseña
          </label>
          <input id="arp-nuevo" type="password" name="password_nuevo"
                 required minlength="6" maxlength="128"
                 autocomplete="new-password"
                 placeholder="Mínimo 6 caracteres"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="arp-confirm">
            Confirmar nueva contraseña
          </label>
          <input id="arp-confirm" type="password" name="password_nuevo_confirm"
                 required minlength="6" maxlength="128"
                 autocomplete="new-password"
                 placeholder="Repite la nueva contraseña"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button"
                  onclick="this.closest('[role=dialog]').remove()"
                  class="px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition-colors">
            Cancelar
          </button>
          <button type="submit"
                  class="px-4 py-2 text-xs font-semibold text-white bg-gradient-to-r from-amber-600 to-rose-600 rounded-md hover:from-amber-700 hover:to-rose-700 transition-colors shadow-sm">
            Actualizar contraseña
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
