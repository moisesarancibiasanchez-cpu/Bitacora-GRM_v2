<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Flujo de datos SortableJS a FastAPI">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="720" height="200" rx="8" fill="#f8fafc"/>

  <g font-family="system-ui" font-size="11" fill="#1e293b">
    <rect x="20" y="60" width="120" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="80" y="90" text-anchor="middle" font-weight="700">SortableJS</text>
    <text x="80" y="106" text-anchor="middle" font-size="10" fill="#475569">Drag tarjeta</text>
    <text x="80" y="120" text-anchor="middle" font-size="10" fill="#475569">onEnd → ticket_id, estado_id</text>

    <rect x="180" y="60" width="120" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="90" text-anchor="middle" font-weight="700">HTMX</text>
    <text x="240" y="106" text-anchor="middle" font-size="10" fill="#475569">POST /tickets/mover</text>
    <text x="240" y="120" text-anchor="middle" font-size="10" fill="#475569">hx-vals JSON</text>

    <rect x="340" y="60" width="120" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="400" y="90" text-anchor="middle" font-weight="700">FastAPI</text>
    <text x="400" y="106" text-anchor="middle" font-size="10" fill="#475569">Valida reglas ITSM</text>
    <text x="400" y="120" text-anchor="middle" font-size="10" fill="#475569">Audita + Celery.task</text>

    <rect x="500" y="20" width="120" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="560" y="42" text-anchor="middle" font-weight="700">PostgreSQL</text>
    <text x="560" y="58" text-anchor="middle" font-size="10" fill="#475569">UPDATE + INSERT auditoría</text>

    <rect x="500" y="120" width="120" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="560" y="142" text-anchor="middle" font-weight="700">Celery + Redis</text>
    <text x="560" y="158" text-anchor="middle" font-size="10" fill="#475569">Recalcular SLAs · Email</text>
  </g>

  <g stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr2)">
    <path d="M140 100 L180 100"/>
    <path d="M300 100 L340 100"/>
    <path d="M460 80 L500 50"/>
    <path d="M460 120 L500 150"/>
  </g>
</svg>
