<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Indicador de Resultado de Pruebas: acrónimo y color del catálogo en la zona inferior de cada tarjeta">
  <rect width="720" height="380" rx="8" fill="#f8fafc"/>
  <text x="360" y="34" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">Indicador de Resultado de Pruebas</text>
  <text x="360" y="55" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">Zona inferior de cada tarjeta — acrónimo + color del catálogo (LOV)</text>
  <line x1="40" y1="70" x2="680" y2="70" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ Mockup de tarjeta ============ -->
  <g>
    <rect x="40" y="90" width="230" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="58" y="118" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#94a3b8">TARJETA DEL TABLERO</text>
    <text x="58" y="144" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">INC-0042</text>
    <rect x="158" y="132" width="52" height="20" rx="10" fill="#fee2e2"/>
    <text x="184" y="146" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">Alta</text>
    <rect x="58" y="160" width="176" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="58" y="178" width="128" height="10" rx="5" fill="#cbd5e1"/>
    <line x1="58" y1="210" x2="252" y2="210" stroke="#e2e8f0" stroke-width="1"/>

    <!-- zona inferior: badge de resultado + semáforo SLA -->
    <text x="58" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Resultado de pruebas</text>
    <rect x="58" y="244" width="50" height="26" rx="13" fill="#16a34a"/>
    <text x="83" y="262" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">OK</text>
    <text x="118" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Pruebas superadas</text>
    <circle cx="242" cy="257" r="9" fill="#22c55e"/>
    <path d="M238 257 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="58" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Indicador SLA (esquina opuesta)</text>
    <rect x="58" y="310" width="34" height="10" rx="5" fill="#e2e8f0"/>
  </g>

  <!-- ============ Leyenda del catálogo ============ -->
  <g>
    <rect x="296" y="90" width="388" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="316" y="120" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#94a3b8">CATÁLOGO ÚNICO (LOV) Y ACRÓNIMOS</text>

    <!-- columna 1 -->
    <g transform="translate(316,158)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#16a34a"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">OK</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">Pruebas superadas</text>
    </g>
    <g transform="translate(316,208)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#94a3b8"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">N/A</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">No aplica</text>
    </g>
    <g transform="translate(316,258)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#eab308"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">OBS</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">Con observaciones</text>
    </g>
    <g transform="translate(316,308)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#ea580c"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">POST</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">Postergada</text>
    </g>

    <!-- columna 2 -->
    <g transform="translate(506,158)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#7c3aed"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">NOOK</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">Desestimada</text>
    </g>
    <g transform="translate(506,208)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#dc2626"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">NOK</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">Pruebas fallidas</text>
    </g>
    <g transform="translate(506,258)">
      <rect x="0" y="-14" width="48" height="24" rx="12" fill="#cbd5e1"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#475569">S/D</text>
      <text x="58" y="4" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e293b">Sin dato</text>
    </g>
    <g transform="translate(506,308)">
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">Al pasar el mouse sobre</text>
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">el badge se ve el valor completo.</text>
    </g>
  </g>

  <text x="360" y="364" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#4f46e5">El Dashboard (sección "Cuenta de Resultado") usa estos mismos colores.</text>
</svg>
