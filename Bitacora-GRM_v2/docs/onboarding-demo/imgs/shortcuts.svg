<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Atajos de teclado">
  <rect width="720" height="320" rx="8" fill="#0f172a"/>
  <text x="360" y="36" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Atajos de teclado</text>
  <text x="360" y="56" font-family="system-ui" font-size="11" text-anchor="middle" fill="#94a3b8">Más rápido que el mouse</text>

  <g transform="translate(60,90)">
    <!-- Keyboard cap pattern -->
    <rect width="600" height="200" rx="10" fill="#1e293b" stroke="#334155"/>

    <!-- Ctrl+K -->
    <g transform="translate(20,20)">
      <rect width="44" height="32" rx="5" fill="#475569"/>
      <text x="22" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">Ctrl</text>
      <text x="55" y="21" font-family="system-ui" font-size="14" fill="#94a3b8">+</text>
      <rect x="68" width="36" height="32" rx="5" fill="#475569"/>
      <text x="86" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">K</text>
      <text x="120" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">Búsqueda global</text>
    </g>

    <g transform="translate(20,60)">
      <rect width="44" height="32" rx="5" fill="#475569"/>
      <text x="22" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">Esc</text>
      <text x="90" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">Cerrar modal</text>
    </g>

    <g transform="translate(20,100)">
      <rect width="60" height="32" rx="5" fill="#475569"/>
      <text x="30" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">Enter</text>
      <text x="86" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">Confirmar formulario</text>
    </g>

    <g transform="translate(20,140)">
      <rect width="44" height="32" rx="5" fill="#475569"/>
      <text x="22" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">Drag</text>
      <text x="80" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">Mover ticket</text>
    </g>

    <g transform="translate(320,20)">
      <rect width="44" height="32" rx="5" fill="#475569"/>
      <text x="22" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">⌘</text>
      <text x="55" y="21" font-family="system-ui" font-size="14" fill="#94a3b8">+</text>
      <rect x="68" width="36" height="32" rx="5" fill="#475569"/>
      <text x="86" y="21" font-family="system-ui" font-size="11" text-anchor="middle" fill="#fff">K</text>
      <text x="120" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">Mac · Búsqueda global</text>
    </g>

    <g transform="translate(320,60)">
      <text x="0" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">🖱 Click tarjeta → Detalle</text>
    </g>
    <g transform="translate(320,100)">
      <text x="0" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">🖱 Drag columna → Reordenar</text>
    </g>
    <g transform="translate(320,140)">
      <text x="0" y="21" font-family="system-ui" font-size="12" fill="#cbd5e1">🖱 Click SLA → Histórico</text>
    </g>
  </g>
</svg>
