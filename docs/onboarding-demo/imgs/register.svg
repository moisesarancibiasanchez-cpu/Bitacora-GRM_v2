<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Pantalla de registro">
  <defs>
    <linearGradient id="page2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" rx="12" fill="url(#page2)"/>
  <!-- Browser -->
  <rect x="40" y="40" width="640" height="400" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <rect x="40" y="40" width="640" height="36" rx="10" fill="#f1f5f9"/>
