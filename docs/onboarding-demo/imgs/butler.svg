<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Regla de automatización Butler: disparador, condiciones, acciones y registro de ejecuciones">
  <rect width="720" height="400" rx="8" fill="#f1f5f9"/>

  <text x="24" y="28" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Automatizaciones Butler</text>
  <text x="24" y="44" font-family="system-ui" font-size="10" fill="#64748b">Una regla reacciona a un disparador, comprueba sus condiciones y ejecuta sus acciones en orden de prioridad.</text>

  <!-- Tarjeta de regla -->
  <rect x="24" y="60" width="420" height="212" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="24" y="60" width="420" height="30" rx="8" fill="#4f46e5"/>
  <rect x="24" y="78" width="420" height="12" fill="#4f46e5"/>
  <text x="40" y="80" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Alta automatica de pendientes</text>
  <rect x="338" y="66" width="90" height="18" rx="9" fill="#ffffff" fill-opacity="0.25"/>
  <text x="383" y="79" font-family="system-ui" font-size="9" text-anchor="middle" fill="#ffffff" font-weight="600">Activa</text>

  <!-- Disparador -->
  <text x="40" y="112" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">DISPARADOR</text>
  <rect x="40" y="120" width="388" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="48" y="127" width="86" height="12" rx="6" fill="#e0e7ff"/>
  <text x="91" y="136" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">ticket_estado</text>
  <rect x="138" y="127" width="52" height="12" rx="6" fill="#a5b4fc"/>
  <text x="164" y="136" font-family="system-ui" font-size="8" text-anchor="middle" fill="#312e81" font-weight="600">cambiado</text>
  <text x="204" y="136" font-family="system-ui" font-size="8" fill="#64748b">Se dispara cuando un ticket entra en una columna nueva</text>

  <!-- Condiciones -->
  <text x="40" y="166" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">CONDICIONES</text>
  <rect x="40" y="174" width="188" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="191" font-family="system-ui" font-size="9" fill="#334155">prioridad</text>
  <text x="104" y="191" font-family="system-ui" font-size="9" fill="#64748b">igual a</text>
  <rect x="152" y="181" width="66" height="14" rx="7" fill="#fee2e2"/>
  <text x="185" y="191" font-family="system-ui" font-size="8" text-anchor="middle" fill="#991b1b" font-weight="600">critica</text>

  <rect x="40" y="206" width="188" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="223" font-family="system-ui" font-size="9" fill="#334155">columna</text>
  <text x="104" y="223" font-family="system-ui" font-size="9" fill="#64748b">igual a</text>
  <rect x="152" y="213" width="66" height="14" rx="7" fill="#fef3c7"/>
  <text x="185" y="223" font-family="system-ui" font-size="8" text-anchor="middle" fill="#92400e" font-weight="600">nuevo</text>

  <rect x="240" y="174" width="188" height="58" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="250" y="191" font-family="system-ui" font-size="9" font-weight="600" fill="#1e293b">Prioridad 10</text>
  <text x="250" y="207" font-family="system-ui" font-size="8" fill="#64748b">Las reglas con menor numero</text>
  <text x="250" y="221" font-family="system-ui" font-size="8" fill="#64748b">se ejecutan primero.</text>

  <!-- Acciones -->
  <text x="40" y="252" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">ACCIONES (en orden)</text>
  <circle cx="50" cy="264" r="8" fill="#16a34a"/>
  <text x="50" y="268" font-family="system-ui" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <text x="66" y="268" font-family="system-ui" font-size="9" font-weight="600" fill="#1e293b">set_asignado</text>
  <text x="152" y="268" font-family="system-ui" font-size="8" fill="#64748b">al responsable de la columna destino</text>

  <circle cx="50" cy="262" r="0" fill="none"/>
  <circle cx="270" cy="264" r="8" fill="#16a34a"/>
  <text x="270" y="268" font-family="system-ui" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <text x="286" y="268" font-family="system-ui" font-size="9" font-weight="600" fill="#1e293b">add_etiqueta</text>
  <text x="358" y="268" font-family="system-ui" font-size="8" fill="#64748b">revision urgente</text>

  <text x="40" y="292" font-family="system-ui" font-size="8" fill="#64748b">Cada ejecucion queda registrada con su resultado, para poder auditar que hizo la regla.</text>
  <text x="40" y="306" font-family="system-ui" font-size="8" fill="#64748b">Una regla desactivada no se ejecuta, pero conserva su configuracion.</text>

  <!-- Disparadores disponibles -->
  <rect x="460" y="60" width="236" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="80" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Disparadores</text>
  <rect x="476" y="90" width="98" height="16" rx="8" fill="#eef2ff"/>
  <text x="525" y="101" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">ticket_creado</text>
  <rect x="580" y="90" width="100" height="16" rx="8" fill="#eef2ff"/>
  <text x="630" y="101" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">ticket_asignado</text>
  <rect x="476" y="110" width="98" height="16" rx="8" fill="#eef2ff"/>
  <text x="525" y="121" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">ticket_etiquetado</text>
  <rect x="580" y="110" width="100" height="16" rx="8" fill="#eef2ff"/>
  <text x="630" y="121" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">cada_dia</text>
  <rect x="476" y="130" width="122" height="16" rx="8" fill="#eef2ff"/>
  <text x="537" y="141" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">ticket_estado_cambiado</text>
  <rect x="604" y="130" width="76" height="16" rx="8" fill="#eef2ff"/>
  <text x="642" y="141" font-family="system-ui" font-size="8" text-anchor="middle" fill="#3730a3" font-weight="600">cada_semana</text>

  <!-- Acciones disponibles -->
  <rect x="460" y="172" width="236" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="192" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Acciones</text>
  <rect x="476" y="200" width="66" height="15" rx="7" fill="#dcfce7"/>
  <text x="509" y="211" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">set_estado</text>
  <rect x="548" y="200" width="68" height="15" rx="7" fill="#dcfce7"/>
  <text x="582" y="211" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">set_asignado</text>
  <rect x="622" y="200" width="58" height="15" rx="7" fill="#dcfce7"/>
  <text x="651" y="211" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">notify</text>

  <rect x="476" y="220" width="72" height="15" rx="7" fill="#dcfce7"/>
  <text x="512" y="231" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">add_etiqueta</text>
  <rect x="554" y="220" width="84" height="15" rx="7" fill="#dcfce7"/>
  <text x="596" y="231" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">remove_etiqueta</text>
  <rect x="644" y="220" width="36" height="15" rx="7" fill="#dcfce7"/>
  <text x="662" y="231" font-family="system-ui" font-size="7" text-anchor="middle" fill="#166534" font-weight="600">archive</text>

  <rect x="476" y="240" width="86" height="15" rx="7" fill="#dcfce7"/>
  <text x="519" y="251" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">add_comentario</text>
  <rect x="568" y="240" width="72" height="15" rx="7" fill="#dcfce7"/>
  <text x="604" y="251" font-family="system-ui" font-size="8" text-anchor="middle" fill="#166534" font-weight="600">backup_db</text>
  <rect x="646" y="240" width="34" height="15" rx="7" fill="#dcfce7"/>
  <text x="663" y="251" font-family="system-ui" font-size="7" text-anchor="middle" fill="#166534" font-weight="600">purga</text>

  <!-- Registro -->
  <rect x="24" y="288" width="672" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="310" font-family="system-ui" font-size="10" font-weight="700" fill="#0f172a">Registro de ejecuciones</text>
  <text x="180" y="310" font-family="system-ui" font-size="8" fill="#64748b">Cada ejecución guarda la regla, el ticket, si terminó bien y el detalle.</text>

  <line x1="52" y1="326" x2="52" y2="356" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="52" cy="330" r="4" fill="#16a34a"/>
  <text x="66" y="334" font-family="system-ui" font-size="9" font-weight="600" fill="#1e293b">#128</text>
  <text x="100" y="334" font-family="system-ui" font-size="8" fill="#166534">Correcto</text>
  <text x="160" y="334" font-family="system-ui" font-size="8" fill="#64748b">Asignado al responsable y etiquetado</text>

  <circle cx="52" cy="354" r="4" fill="#f59e0b"/>
  <text x="66" y="358" font-family="system-ui" font-size="9" font-weight="600" fill="#1e293b">#131</text>
  <text x="100" y="358" font-family="system-ui" font-size="8" fill="#92400e">Con detalle</text>
  <text x="160" y="358" font-family="system-ui" font-size="8" fill="#64748b">El estado destino no existia en ese momento</text>

  <circle cx="420" cy="330" r="4" fill="#16a34a"/>
  <text x="434" y="334" font-family="system-ui" font-size="8" fill="#64748b">#140 · Correcto</text>
  <circle cx="420" cy="354" r="4" fill="#16a34a"/>
  <text x="434" y="358" font-family="system-ui" font-size="8" fill="#64748b">#145 · Correcto</text>
</svg>