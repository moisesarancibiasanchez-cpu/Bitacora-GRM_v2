<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Interfaz principal del tablero Kanban">
  <defs>
    <linearGradient id="topbar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="10" fill="#f1f5f9"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#topbar)"/>
  <text x="40" y="38" font-family="system-ui" font-size="18" font-weight="700" fill="#fff">Bitácora GRM</text>
  <g font-family="system-ui" font-size="13" fill="#cbd5e1">
    <text x="200" y="38">Tablero</text>
    <text x="270" y="38">Tickets</text>
    <text x="345" y="38">Usuarios</text>
  </g>
  <rect x="500" y="18" width="380" height="26" rx="13" fill="#475569"/>
  <text x="520" y="35" font-family="system-ui" font-size="12" fill="#94a3b8">⌘K  Buscar tickets, usuarios, comandos…</text>
  <circle cx="1130" cy="30" r="14" fill="#22c55e"/>
  <text x="1110" y="34" font-family="system-ui" font-size="12" fill="#fff">JP</text>
  <!-- Sub-toolbar -->
  <rect x="0" y="60" width="1200" height="50" fill="#fff" stroke="#e2e8f0"/>
  <rect x="20" y="76" width="100" height="22" rx="4" fill="#e0e7ff"/>
  <text x="36" y="91" font-family="system-ui" font-size="11" font-weight="600" fill="#4338ca">Filtros (1)</text>
  <rect x="130" y="76" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="146" y="91" font-family="system-ui" font-size="11" fill="#475569">Archivados</text>
  <rect x="990" y="72" width="190" height="30" rx="6" fill="#4f46e5"/>
  <text x="1085" y="91" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">+ Nueva Incidencia</text>
  <!-- Columns -->
  <g transform="translate(20,130)">
    <!-- Nuevo -->
    <rect x="0" y="0" width="220" height="370" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#e0e7ff"/>
    <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#3730a3">NUEVO</text>
    <text x="200" y="22" font-family="system-ui" font-size="12" text-anchor="end" fill="#6366f1">(2)</text>
    <!-- Cards -->
    <g transform="translate(10,46)">
      <rect width="200" height="68" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="10" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#92400e">INC-0042</text>
      <text x="10" y="34" font-family="system-ui" font-size="11" fill="#1e293b">No puedo acceder al SAP</text>
      <rect x="10" y="44" width="32" height="14" rx="3" fill="#dc2626"/>
      <text x="26" y="54" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="700" fill="#fff">Alta</text>
      <circle cx="180" cy="54" r="6" fill="#22c55e"/>
    </g>
    <g transform="translate(10,124)">
      <rect width="200" height="68" rx="5" fill="#e0e7ff" stroke="#6366f1"/>
      <text x="10" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#3730a3">INC-0043</text>
      <text x="10" y="34" font-family="system-ui" font-size="11" fill="#1e293b">Impresora sin conexión</text>
      <rect x="10" y="44" width="36" height="14" rx="3" fill="#f59e0b"/>
      <text x="28" y="54" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="700" fill="#fff">Media</text>
      <circle cx="180" cy="54" r="6" fill="#22c55e"/>
    </g>
  </g>
  <!-- En curso -->
  <g transform="translate(250,130)">
    <rect x="0" y="0" width="220" height="370" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#dbeafe"/>
    <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#1e40af">EN CURSO</text>
    <text x="200" y="22" font-family="system-ui" font-size="12" text-anchor="end" fill="#2563eb">(1)</text>
    <g transform="translate(10,46)">
      <rect width="200" height="68" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="10" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#991b1b">INC-0040</text>
      <text x="10" y="34" font-family="system-ui" font-size="11" fill="#1e293b">Error 500 al guardar</text>
      <rect x="10" y="44" width="36" height="14" rx="3" fill="#dc2626"/>
      <text x="28" y="54" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="700" fill="#fff">Crít.</text>
      <circle cx="180" cy="54" r="6" fill="#f59e0b"/>
    </g>
  </g>
  <!-- En espera -->
  <g transform="translate(480,130)">
    <rect x="0" y="0" width="220" height="370" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#fef3c7"/>
    <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#92400e">EN ESPERA</text>
    <text x="200" y="22" font-family="system-ui" font-size="12" text-anchor="end" fill="#a16207">(1)</text>
    <g transform="translate(10,46)">
      <rect width="200" height="68" rx="5" fill="#f3e8ff" stroke="#9333ea"/>
      <text x="10" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#6b21a8">INC-0039</text>
      <text x="10" y="34" font-family="system-ui" font-size="11" fill="#1e293b">Solicitud nuevo usuario</text>
      <rect x="10" y="44" width="36" height="14" rx="3" fill="#f59e0b"/>
      <text x="28" y="54" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="700" fill="#fff">Media</text>
      <circle cx="180" cy="54" r="6" fill="#22c55e"/>
    </g>
  </g>
  <!-- Resuelto -->
  <g transform="translate(710,130)">
    <rect x="0" y="0" width="220" height="370" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#dcfce7"/>
    <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#166534">RESUELTO</text>
    <text x="200" y="22" font-family="system-ui" font-size="12" text-anchor="end" fill="#16a34a">(3)</text>
    <g transform="translate(10,46)">
      <rect width="200" height="68" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="10" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#166534">INC-0037</text>
      <text x="10" y="34" font-family="system-ui" font-size="11" fill="#1e293b">Reasignar permisos</text>
      <rect x="10" y="44" width="32" height="14" rx="3" fill="#22c55e"/>
      <text x="26" y="54" font-family="system-ui" font-size="9" text-anchor="middle" font-weight="700" fill="#fff">Baja</text>
      <circle cx="180" cy="54" r="6" fill="#22c55e"/>
    </g>
  </g>
  <!-- Cerrado -->
  <g transform="translate(940,130)">
    <rect x="0" y="0" width="240" height="370" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="240" height="36" rx="8" fill="#f1f5f9"/>
    <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#475569">CERRADO</text>
    <text x="220" y="22" font-family="system-ui" font-size="12" text-anchor="end" fill="#64748b">(12)</text>
    <g transform="translate(10,46)" opacity="0.55">
      <rect width="220" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="10" y="18" font-family="system-ui" font-size="10" fill="#64748b">INC-0030 — VPN lenta</text>
      <text x="10" y="32" font-family="system-ui" font-size="9" fill="#94a3b8">Resuelto hace 3 días</text>
    </g>
  </g>
</svg>
