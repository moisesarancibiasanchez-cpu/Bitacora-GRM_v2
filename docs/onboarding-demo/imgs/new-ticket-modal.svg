<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Modal de nueva incidencia">
  <rect width="720" height="520" fill="#0f172a" opacity="0.55"/>
  <!-- Modal -->
  <rect x="80" y="40" width="560" height="440" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <!-- Header -->
  <rect x="80" y="40" width="560" height="56" rx="10" fill="#4f46e5"/>
  <text x="100" y="72" font-family="system-ui" font-size="16" font-weight="700" fill="#fff">+ Nueva Incidencia</text>
  <text x="610" y="72" font-family="system-ui" font-size="18" text-anchor="end" fill="#fff" font-weight="700">×</text>
  <!-- Body -->
  <g font-family="system-ui" font-size="11" fill="#475569">
    <text x="100" y="124">Título *</text>
    <rect x="100" y="130" width="520" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="112" y="151" font-family="system-ui" font-size="11" fill="#1e293b">No puedo acceder al sistema SAP desde esta mañana</text>

    <text x="100" y="178">Descripción detallada (Markdown)</text>
    <rect x="100" y="184" width="520" height="80" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="112" y="206" font-family="ui-monospace,monospace" font-size="10" fill="#475569">**Pasos:**</text>
    <text x="112" y="222" font-family="ui-monospace,monospace" font-size="10" fill="#475569">1. Abrir navegador</text>
    <text x="112" y="238" font-family="ui-monospace,monospace" font-size="10" fill="#475569">2. Ingresar a https://sap.empresa.com</text>
    <text x="112" y="254" font-family="ui-monospace,monospace" font-size="10" fill="#dc2626">3. Error: "Service Unavailable"</text>

    <!-- 3 selects -->
    <text x="100" y="284">Tipo</text>
    <rect x="100" y="290" width="160" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="112" y="310" font-family="system-ui" font-size="11" fill="#1e293b">Incidencia ▾</text>

    <text x="280" y="284">Prioridad</text>
    <rect x="280" y="290" width="160" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="292" y="300" width="46" height="14" rx="3" fill="#dc2626"/>
    <text x="315" y="310" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="700" fill="#fff">Alta</text>

    <text x="460" y="284">Vencimiento</text>
    <rect x="460" y="290" width="160" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="472" y="310" font-family="system-ui" font-size="11" fill="#94a3b8">dd/mm/aaaa</text>

    <!-- Dropzone -->
    <text x="100" y="344">Adjuntos</text>
    <rect x="100" y="350" width="520" height="60" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,4"/>
    <text x="360" y="378" font-family="system-ui" font-size="11" text-anchor="middle" fill="#64748b">Arrastrá archivos o hacé click para seleccionar</text>
    <text x="360" y="396" font-family="system-ui" font-size="10" text-anchor="middle" fill="#94a3b8">Imágenes, PDFs, ZIPs</text>
  </g>
  <!-- Footer -->
  <rect x="80" y="430" width="560" height="50" rx="0" fill="#f8fafc"/>
  <rect x="80" y="430" width="560" height="1" fill="#e2e8f0"/>
  <rect x="490" y="442" width="130" height="28" rx="5" fill="#4f46e5"/>
  <text x="555" y="461" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">Crear Incidencia</text>
  <rect x="350" y="442" width="130" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="415" y="461" font-family="system-ui" font-size="12" text-anchor="middle" fill="#475569">Cancelar</text>
</svg>
