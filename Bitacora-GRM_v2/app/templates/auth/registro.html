{% extends "base.html" %}
{% block title %}Crear cuenta · Bitácora GRM{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-purple-50 p-4 py-8">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-6">
      <div class="text-center mb-5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 mx-auto flex items-center justify-center mb-3 shadow-md">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <h1 class="text-lg font-semibold text-slate-800">Crear cuenta</h1>
        <p class="text-xs text-slate-500 mt-1">Únete a Bitácora GRM</p>
      </div>

      <div id="registro-msg"></div>

      <form hx-post="/api/v1/auth/registro-form"
            hx-target="#registro-msg" hx-swap="innerHTML"
            class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre completo</label>
          <input type="text" name="nombre_completo" required minlength="3" maxlength="200"
                 placeholder="Juan Pérez González"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Usuario</label>
            <input type="text" name="username" required minlength="3" maxlength="64"
                   pattern="[a-zA-Z0-9_.\-]+" title="Solo letras, números, guion y guion bajo"
                   placeholder="jperez"
                   class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Departamento</label>
            <input type="text" name="departamento" maxlength="120"
                   placeholder="Soporte TI"
                   class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
          <input type="email" name="email" required maxlength="120"
                 placeholder="tu@empresa.cl"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña (mín. 6 caracteres)</label>
          <input type="password" name="password" required minlength="6" maxlength="128"
                 autocomplete="new-password"
                 placeholder="••••••••"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Confirmar contraseña</label>
          <input type="password" name="confirm_password" required minlength="6" maxlength="128"
                 autocomplete="new-password"
                 placeholder="••••••••"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <button type="submit"
                class="w-full px-3 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-md text-sm font-semibold hover:from-purple-700 hover:to-pink-700 transition-colors shadow-sm">
          Crear cuenta
        </button>
      </form>

      <div class="mt-4 pt-4 border-t border-slate-200 text-center">
        <p class="text-xs text-slate-500">
          ¿Ya tienes cuenta?
          <a href="/auth/login" class="text-indigo-600 hover:text-indigo-700 font-semibold hover:underline">Inicia sesión</a>
        </p>
      </div>
    </div>

    <p class="text-center text-[10px] text-slate-400 mt-3">
      Si eres el primer usuario registrado, tu rol será Administrador.
    </p>
  </div>
</div>
{% endblock %}
