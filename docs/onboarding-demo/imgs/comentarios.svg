<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Comentarios con menciones, adjuntos, reacciones, ventana de edición y comentarios internos">
  <rect width="720" height="400" rx="8" fill="#f1f5f9"/>

  <!-- Comentario 1: normal con mención -->
  <rect x="24" y="20" width="672" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="48" cy="48" r="14" fill="#4f46e5"/>
  <text x="48" y="53" font-family="system-ui" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">LM</text>
  <text x="70" y="46" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Lucía Morales</text>
  <text x="70" y="62" font-family="system-ui" font-size="10" fill="#64748b">hace 12 min · Agente Senior</text>

  <rect x="552" y="38" width="72" height="18" rx="9" fill="#dbeafe"/>
  <text x="588" y="51" font-family="system-ui" font-size="10" text-anchor="middle" fill="#1e40af" font-weight="600">@jperez</text>

  <text x="70" y="86" font-family="system-ui" font-size="11" fill="#1e293b">Revisé el log y el error viene de la validación. <tspan fill="#1e40af" font-weight="600">@jperez</tspan> ¿puedes confirmarlo con QA?</text>

  <!-- Adjuntos dentro del comentario -->
  <rect x="70" y="98" width="80" height="24" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <path d="M80 106 L86 112 L80 118" stroke="#16a34a" stroke-width="1.5" fill="none"/>
  <text x="128" y="114" font-family="system-ui" font-size="9" text-anchor="middle" fill="#166534">log.png</text>
  <rect x="158" y="98" width="86" height="24" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <path d="M168 106 L174 112 L168 118" stroke="#16a34a" stroke-width="1.5" fill="none"/>
  <text x="209" y="114" font-family="system-ui" font-size="9" text-anchor="middle" fill="#166534">traza.txt</text>

  <!-- Reacciones -->
  <rect x="256" y="98" width="40" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="276" y="114" font-family="system-ui" font-size="10" text-anchor="middle" fill="#1e293b">OK 2</text>

  <!-- Ventana de edición -->
  <rect x="556" y="98" width="134" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <circle cx="571" cy="110" r="5" fill="#f59e0b"/>
  <path d="M571 106 L571 110 L574 112" stroke="#fff" stroke-width="1.2" fill="none"/>
  <text x="626" y="114" font-family="system-ui" font-size="10" text-anchor="middle" fill="#92400e" font-weight="600">Editar · 24:13</text>

  <line x1="24" y1="152" x2="696" y2="152" stroke="#e2e8f0"/>

  <!-- Comentario 2: interno -->
  <rect x="24" y="164" width="672" height="88" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="4,3"/>
  <circle cx="48" cy="192" r="14" fill="#b45309"/>
  <text x="48" y="197" font-family="system-ui" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">AR</text>
  <text x="70" y="190" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Andrés Ruiz</text>
  <text x="70" y="206" font-family="system-ui" font-size="10" fill="#64748b">hace 4 min · Administrador</text>
  <rect x="182" y="180" width="66" height="18" rx="9" fill="#fef3c7"/>
  <text x="215" y="193" font-family="system-ui" font-size="9" text-anchor="middle" fill="#92400e" font-weight="700">INTERNO</text>
  <text x="70" y="232" font-family="system-ui" font-size="11" fill="#7c2d12">Los solicitantes nunca ven este comentario.</text>

  <!-- Resumen de capacidades -->
  <rect x="24" y="264" width="672" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="288" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">Qué puedes hacer en un comentario</text>

  <circle cx="50" cy="310" r="3" fill="#16a34a"/>
  <text x="62" y="314" font-family="system-ui" font-size="10" fill="#1e293b">Escribir en Markdown, hasta <tspan font-weight="600">5000 caracteres</tspan></text>

  <circle cx="50" cy="332" r="3" fill="#16a34a"/>
  <text x="62" y="336" font-family="system-ui" font-size="10" fill="#1e293b">Adjuntar archivos y pegar capturas con <tspan font-weight="600">Ctrl+V</tspan></text>

  <circle cx="50" cy="354" r="3" fill="#16a34a"/>
  <text x="62" y="358" font-family="system-ui" font-size="10" fill="#1e293b">Mencionar con <tspan font-weight="600">@usuario</tspan> para avisar a alguien del equipo</text>

  <circle cx="400" cy="310" r="3" fill="#16a34a"/>
  <text x="412" y="314" font-family="system-ui" font-size="10" fill="#1e293b">Editar durante <tspan font-weight="600">30 minutos</tspan> tras escribirlo</text>

  <circle cx="400" cy="332" r="3" fill="#16a34a"/>
  <text x="412" y="336" font-family="system-ui" font-size="10" fill="#1e293b">Marcar como <tspan font-weight="600">interno</tspan> para el equipo</text>

  <circle cx="400" cy="354" r="3" fill="#16a34a"/>
  <text x="412" y="358" font-family="system-ui" font-size="10" fill="#1e293b">Reaccionar para responder sin escribir</text>

  <line x1="40" y1="366" x2="680" y2="366" stroke="#e2e8f0"/>
  <text x="44" y="378" font-family="system-ui" font-size="8" fill="#64748b">Superados los 30 minutos, el comentario queda fijo: escribe uno nuevo indicando la corrección.</text>
</svg>