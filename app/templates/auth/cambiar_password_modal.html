<!--
  Modal: Cambiar contraseña (auto-servicio)
  Cargado por HTMX desde la navbar. Devuelve un fragmento HTML que se monta
  dentro de <div id="modal-root"> y se cierra con el botón "Cancelar" o por
  el evento HTMX "cambio-password-ok" tras éxito.
-->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
     role="dialog" aria-modal="true" aria-labelledby="cambiar-pwd-titulo">
  <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 bg-gradient-to-r from-indigo-50 to-purple-50">
      <div class="flex items-center gap-2">
        <span class="inline-flex w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 11c1.66 0 3-1.34 3-3V5a3 3 0 10-6 0v3c0 1.66 1.34 3 3 3zm6 0H6c-1.1 0-2 .9-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8c0-1.1-.9-2-2-2z"/>
          </svg>
        </span>
        <h2 id="cambiar-pwd-titulo" class="text-base font-semibold text-slate-800">Cambiar contraseña</h2>
      </div>
      <button type="button"
              onclick="this.closest('[role=dialog]').remove()"
              class="text-slate-400 hover:text-slate-700 transition-colors p-1 rounded hover:bg-white/60"
              aria-label="Cerrar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="px-5 py-4">
      <p class="text-xs text-slate-500 mb-3">
        Por seguridad, ingresa tu contraseña actual antes de definir una nueva.
        Debe tener entre 6 y 128 caracteres y ser distinta a la actual.
      </p>

      <div id="cambiar-pwd-msg"></div>

      <form hx-post="/api/v1/auth/cambiar-password-form"
            hx-target="#cambiar-pwd-msg" hx-swap="innerHTML"
            hx-on::after-request="
              /* Solo limpiamos el formulario en éxito. El cierre del modal y
                 el toast lo maneja el listener global 'cambio-password-ok'
                 registrado en auth-events.js (los <script> inline dentro de
                 un swap por innerHTML NO se ejecutan en HTMX). */
              if (event.detail.successful) {
                try { event.target.reset(); } catch (e) { /* noop */ }
              }
            "
            class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="cp-actual">
            Contraseña actual
          </label>
          <input id="cp-actual" type="password" name="password_actual"
                 required minlength="6" maxlength="128"
                 autocomplete="current-password"
                 placeholder="••••••••"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="cp-nuevo">
            Nueva contraseña
          </label>
          <input id="cp-nuevo" type="password" name="password_nuevo"
                 required minlength="6" maxlength="128"
                 autocomplete="new-password"
                 placeholder="Mínimo 6 caracteres"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="cp-confirm">
            Confirmar nueva contraseña
          </label>
          <input id="cp-confirm" type="password" name="password_nuevo_confirm"
                 required minlength="6" maxlength="128"
                 autocomplete="new-password"
                 placeholder="Repite la nueva contraseña"
                 class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button"
                  onclick="this.closest('[role=dialog]').remove()"
                  class="px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition-colors">
            Cancelar
          </button>
          <button type="submit"
                  class="px-4 py-2 text-xs font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 rounded-md hover:from-indigo-700 hover:to-purple-700 transition-colors shadow-sm">
            Actualizar contraseña
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
