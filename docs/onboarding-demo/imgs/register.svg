    <rect x="182" y="298" width="200" height="6" rx="2" fill="#cbd5e1"/>

    <text x="170" y="328">Contraseña</text>
    <rect x="170" y="334" width="380" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
