<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z'/%3E%3C/svg%3E" />
    <style>
        /* Kanban específico */
        .kanban-column { min-height: 60vh; }
        .kanban-ticket.dragging { opacity: 0.5; transform: rotate(2deg); }
        .kanban-column.drag-over { background-color: rgba(37, 99, 235, 0.05); border-color: #2563eb; }
        .priority-badge { font-size: 0.65rem; padding: 0.1rem 0.4rem; }
        .sla-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .sla-ok { background-color: #16a34a; }
        .sla-warn { background-color: #f59e0b; }
        .sla-overdue { background-color: #dc2626; }
        .sla-unknown { background-color: #94a3b8; }
        [hx-trigger] { transition: opacity 0.2s; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    {% if usuario %}
    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-14">
            <div class="flex items-center gap-6">
                <a href="/kanban" class="flex items-center gap-2 text-slate-900 font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
                    </svg>
                    {{ app_name }}
                </a>
                <a href="/kanban" class="text-sm text-slate-600 hover:text-slate-900">Tablero</a>
                <a href="/api/v1/catalogos/estados" target="_blank" class="text-sm text-slate-600 hover:text-slate-900">API Catálogos</a>
            </div>
            <div class="flex items-center gap-3 text-sm">
                <span class="text-slate-500">Hola,</span>
                <span class="font-medium text-slate-800">{{ usuario.username }}</span>
                <span class="px-2 py-0.5 text-xs rounded-full bg-blue-100 text-blue-800">{{ usuario.rol.value }}</span>
                <form method="post" action="/auth/logout" class="inline">
                    <button class="text-slate-500 hover:text-rose-600 text-sm">Salir</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="{% if not usuario %}min-h-screen flex items-center justify-center{% else %}max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <div id="kanban-toast" class="hidden fixed bottom-4 right-4 bg-rose-600 text-white px-4 py-2 rounded shadow-lg z-50"></div>
    <script>
        // Toast HTMX para errores
        document.body.addEventListener('kanban-error', function (e) {
            const toast = document.getElementById('kanban-toast');
            toast.textContent = e.detail || 'Error';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        });
    </script>
    {% block body_extra %}{% endblock %}
</body>
</html>
